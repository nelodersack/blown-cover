<!doctype html><html lang=de><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Blown Cover</title><meta name=robots content=noindex>
<style>html,body{margin:0;background:#16191c;color:#9ca1a8;font:15px system-ui,sans-serif}</style></head><body>
<script>/* Einladungslink blowncover.app/CODE: GitHub Pages kennt keine Umleitungen, darum landet der Pfad hier und geht als ?c=CODE zur App. Alles andere geht zur Startseite. */
var m=location.pathname.match(/^\/([A-Za-z2-9]{4,6})\/?$/);location.replace('/'+(m?'?c='+m[1].toUpperCase():'')+location.hash)</script>
<noscript>Blown Cover braucht JavaScript.</noscript></body></html>
