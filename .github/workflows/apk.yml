name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [android-app]

# Release veröffentlichen (Tag v<versionName>, Asset BlownCover.apk) braucht Schreibrecht.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Signaturschlüssel aus Secret holen
        env:
          KS_B64: ${{ secrets.BC_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.BC_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Secrets BC_KEYSTORE_B64 und/oder BC_KEYSTORE_PASSWORD fehlen (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
          echo "BC_KEYSTORE_FILE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        env:
          BC_KEYSTORE_PASSWORD: ${{ secrets.BC_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Signatur-Fingerabdruck (SHA-256, für assetlinks.json)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$AS" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          FP=$(grep -m1 'SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}' | tr a-f A-F | sed 's/../&:/g;s/:$//')
          echo "SHA-256 (assetlinks.json): $FP"
          echo "### Signatur-Fingerabdruck SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$FP\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/sideload.jks"

      # Website (App-Update) liest releases/latest und lädt releases/latest/download/BlownCover.apk.
      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/android-app'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/")
          TAG="v$VER"
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" "$RUNNER_TEMP/BlownCover.apk"
          LAST=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          echo "Version $TAG, bisher neueste Veröffentlichung: ${LAST:-keine}"
          # versionName muss steigen (nach Zahlen, 0.3.10 > 0.3.9); gleiche Version = Asset ersetzen.
          if [ -n "$LAST" ] && [ "$LAST" != "$TAG" ] && [ "$(printf '%s\n%s\n' "${LAST#v}" "$VER" | sort -V | tail -1)" != "$VER" ]; then
            echo "::error::versionName $VER ist nicht größer als $LAST – bitte in app/build.gradle erhöhen."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/BlownCover.apk" --clobber
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" "$RUNNER_TEMP/BlownCover.apk" --target "$GITHUB_SHA" \
              --title "Blown Cover App $VER" --notes "Android-App $VER (Commit ${GITHUB_SHA::7}). Installieren: BlownCover.apk." --latest
          fi
          echo "### Release $TAG veröffentlicht" >> "$GITHUB_STEP_SUMMARY"

      - name: APK hochladen
        uses: actions/upload-artifact@v5
        with:
          name: BlownCover-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
