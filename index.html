<script>
firebase.initializeApp({
  apiKey:"AIzaSyD0T2moi4bFBaOpJyiRWRD7iBinnuyh9N0",

const db=firebase.database();
let off=0,uid,code,G=null,pos=null,lastFix=0,lastW=0,wasOut=false,lastK=0,ping=null,cand=[],lastSig='',fitted=false,wl,cm=null,drag=0,lastKey='';
let lk={},lastTV='';
let me={name:localStorage.n||''};
db.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
const now=()=>Date.now()+off,$=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const D=(a,b)=>{const t=Math.PI/180,x=(b.lat-a.lat)*t,y=(b.lng-a.lng)*t*Math.cos((a.lat+b.lat)*t/2);return 6371000*Math.hypot(x,y)};
const P=()=>(G&&G.players)||{};
const rs=g=>g.startAt+g.s.head*6e4;
const Rad=(g,t)=>!g.startAt?g.s.r0:Math.max(g.s.rMin,g.s.r0*Math.pow(.8,Math.max(0,Math.floor((t-rs(g))/(g.s.shrink*6e4)))));
const AR='<svg width=24 height=14 viewBox="0 0 24 14" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M1 7h9M7 4l3 3-3 3M23 7h-9M17 4l-3 3 3 3"/></svg>';
const fmt=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0')};
// <helpers>
const RadS=(s,el)=>Math.max(s.rMin,s.r0*Math.pow(.8,Math.max(0,Math.floor(el/(s.shrink*6e4)))));
const lastR=s=>RadS(s,s.dur*6e4-1);
const taskRad=s=>s.taskR>0?s.taskR:lastR(s);
const md=g=>g.s.mode||'survive';
const missionOk=g=>true;
const tv=(g,id,t)=>{const k=g.tasks&&g.tasks[id];return !!k&&t>=k.t0};
const rankOf=(inn,u)=>{const a=Object.entries(inn||{}).sort((x,y)=>x[1].t-y[1].t||(x[0]<y[0]?-1:1));return a.findIndex(e=>e[0]===u)+1};
function myItems(g){const r=rankOf(g.tasks&&g.tasks.sh&&g.tasks.sh.in,uid),im=g.s.imm||120;
  return r===1?[{id:'sh',sec:im}]:r===2?[{id:'sh',sec:Math.round(im/2)}]:[]}
function ovPts(j,c,R){const o=[];((j&&j.elements)||[]).forEach(e=>{
  if(e.geometry)e.geometry.forEach(n=>o.push({lat:n.lat,lng:n.lon}));
  else if(e.center)o.push({lat:e.center.lat,lng:e.center.lon})});
  return o.filter(p=>D(c,p)<=R)}
function pickSpaced(a,n,d){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[r[i],r[j]]=[r[j],r[i]]}
  const o=[];for(const p of r){if(o.every(q=>D(p,q)>=d))o.push(p);if(o.length>=n)break}return o}
function randPts(c,R,n,d,have){const o=(have||[]).slice(),out=[];let k=0;
  while(out.length<n&&k++<800){const a=Math.random()*6.2832,r=R*Math.sqrt(Math.random()),
    p={lat:c.lat+r*Math.cos(a)/111320,lng:c.lng+r*Math.sin(a)/(111320*Math.cos(c.lat*Math.PI/180))};
    if(o.every(q=>D(p,q)>=d)){o.push(p);out.push(p)}}return out}
async function ovPost(q){for(const h of['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){
  try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),9000);
    const r=await fetch(h,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ac.signal});
    clearTimeout(tm);if(r.ok)return await r.json()}catch(e){}}return null}
async function mkPts(c,R,n){const d=Math.max(40,Math.min(120,R/5)),A=`(around:${Math.round(R)},${c.lat},${c.lng})`;
  const j1=await ovPost(`[out:json][timeout:20];way${A}["highway"~"^(footway|pedestrian|path|cycleway|living_street)$"]["access"!~"^(private|no)$"];out geom 300;way${A}["leisure"~"^(park|playground|garden)$"];out center 100;`);
  let sel=pickSpaced(ovPts(j1,c,R),n,d);
  if(j1&&sel.length<n){const x=ovPts(await ovPost(`[out:json][timeout:20];way${A}["highway"~"^(residential|unclassified)$"]["access"!~"^(private|no)$"];out geom 200;`),c,R).filter(p=>sel.every(q=>D(p,q)>=d));
    sel=sel.concat(pickSpaced(x,n-sel.length,d))}
  let fb=false;if(sel.length<n){sel=sel.concat(randPts(c,R,n-sel.length,d,sel));fb=true}
  return{pts:sel,fb}}
// </helpers>

let lastE=0;addEventListener('unhandledrejection',e=>{const m=(e.reason&&e.reason.message)||'';if(Date.now()-lastE>4000){lastE=Date.now();toast('Fehler: '+m.slice(0,80))}});
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3500)}
async function lock(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&G&&G.status==='running')lock()});

// Karte
const map=L.map('map',{zoomControl:false,maxZoom:20}).setView([47.5,14.5],7);
if(L.maplibreGL)L.maplibreGL({style:'https://tiles.openfreemap.org/styles/positron',attribution:'© OpenFreeMap, © OpenMapTiles, Daten von OpenStreetMap'}).addTo(map);
else{const E='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
  L.tileLayer(E+'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:16,maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);
  L.tileLayer(E+'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:16,maxZoom:19}).addTo(map)}
const lay=L.layerGroup().addTo(map);
map.on('click',e=>{if(G&&G.status==='lobby'&&G.host===uid)db.ref(`games/${code}/c`).set({lat:e.latlng.lat,lng:e.latlng.lng})});

// GPS
function startGPS(){if(startGPS.on)return;startGPS.on=1;
  navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};lastFix=Date.now();
    const g=$('gs');if(g)g.textContent='GPS bereit ✓';if(!G&&!fitted)map.setView([pos.lat,pos.lng],16);write()},
    e=>toast('GPS: '+e.message),{enableHighAccuracy:true,maximumAge:0,timeout:20000})}
function write(f){if(!code||!pos||!G)return;const t=Date.now();if(!f&&t-lastW<4000)return;lastW=t;
  db.ref(`games/${code}/players/${uid}`).update({lat:pos.lat,lng:pos.lng,ts:now()})}

// Start / Beitritt
async function mk(){me.name=($('nm').value.trim()||'Agent').slice(0,16);localStorage.n=me.name;startGPS();
  if(!pos){const b=$('mkb');b.textContent='GPS wird gesucht…';b.disabled=true;
    for(let i=0;i<100&&!pos;i++)await new Promise(r=>setTimeout(r,200));
    if(!pos){b.textContent='Neues Spiel erstellen';b.disabled=false;return toast('Kein GPS – bitte Standortfreigabe prüfen')}}
  const c=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
  await db.ref('games/'+c).set({host:uid,status:'lobby',c:pos,s:{r0:500,rMin:200,shrink:5,head:2,dur:30,ping:60,pen:2,mode:'survive',taskR:0,imm:120,shOn:true,shT:10,evT:5}});join(c)}
function jn(){me.name=($('nm').value.trim()||'Agent').slice(0,16);localStorage.n=me.name;startGPS();join($('cd').value.trim().toUpperCase())}
async function join(c){const s=await db.ref('games/'+c).get();
  if(!s.exists()){localStorage.removeItem('c');return toast('Code unbekannt')}
  const g=s.val(),had=g.players&&g.players[uid];
  if(g.status!=='lobby'&&!had)return toast('Spiel läuft bereits');
  code=c;localStorage.c=c;
  if(!had)await db.ref(`games/${c}/players/${uid}`).set({name:me.name||'Agent',role:'hider',state:'alive'});
  db.ref('games/'+c).on('value',s=>{if(!s.exists()){localStorage.removeItem('c');location.reload();return}G=s.val();onData()})}

// Lobby-Aktionen
const setRole=r=>db.ref(`games/${code}/players/${uid}/role`).set(r);
const setS=(k,v,mn=1)=>db.ref(`games/${code}/s/${k}`).set(Math.max(mn,Math.round(+v)||mn));
const setB=(k,v)=>db.ref(`games/${code}/s/${k}`).set(v==='1');
const setMode=m=>db.ref(`games/${code}/s`).update({mode:m,shOn:m==='survive'});
function ctr(){if(pos)db.ref(`games/${code}/c`).set(pos)}
async function st(){const v=Object.values(P());
  if(!v.some(p=>p.role==='hunter')||!v.some(p=>p.role==='hider'))return toast('Mindestens 1 Hunter und 1 Hider nötig');
  const g=G,s=g.s,b=$('stb'),need=md(g)==='mission'?['ev']:(s.shOn?['sh']:[]);
  if(b){b.disabled=true;b.textContent='Orte werden gesucht…'}
  try{let r=null;if(need.length)r=await mkPts(g.c,Math.max(40,taskRad(s)-15),4*need.length);
    const startAt=now()+5000,R0=startAt+s.head*6e4,tasks={};
    need.forEach((id,i)=>{const a=r.pts.slice(i*4,i*4+4);
      tasks[id]={t0:id==='ev'?R0+Math.max(0,s.dur-s.evT)*6e4:R0+Math.min(s.shT,s.dur-1)*6e4,loc:a[0],alt:a.slice(1),rr:0}});
    if(r&&r.fb)toast('Keine Kartendaten erreichbar: Zufallsorte');
    const u={status:'running',startAt};if(need.length)u.tasks=tasks;
    await db.ref('games/'+code).update(u)}
  catch(e){toast('Start fehlgeschlagen: '+String(e.message||e).slice(0,60));if(b){b.disabled=false;b.textContent='Spiel starten'}}}
// Fangen
function cc(){if(!pos)return;const t=now();
  cand=Object.entries(P()).filter(([k,p])=>p.role==='hider'&&p.state==='alive'&&p.lat&&t-p.ts<30000&&D(pos,p)<=40);
  if(!cand.length)toast('Kein Hider in 40 m');panel(1)}
function rq(h){cand=[];db.ref(`games/${code}/catches/${h}`).set({hunter:uid,t:now(),status:'pending'});toast('Anfrage gesendet');panel(1)}
function ok(){db.ref(`games/${code}/players/${uid}/state`).set('caught');db.ref(`games/${code}/catches/${uid}/status`).set('done')}
function no(){db.ref(`games/${code}/catches/${uid}/status`).set('denied')}
async function fin(){if(!confirm('Spiel beenden und alle Daten löschen?'))return;try{await db.ref('chats/'+code).remove()}catch(e){}db.ref('games/'+code).remove()}
function leave(){localStorage.removeItem('c');location.reload()}
const endNow=()=>{if(confirm('Spiel wirklich beenden?'))db.ref('games/'+code).update({status:'over',winner:'hider'})};

// Aufgaben
function chk(id){const k=G.tasks&&G.tasks[id],m=P()[uid]||{};if(!k||!pos||m.state!=='alive')return;
  if(D(pos,k.loc)>40)return toast('Noch nicht am Ort');
  if(id==='sh'){if(Object.keys(k.in||{}).length>=2)return toast('Safehouse bereits vergeben');
    db.ref(`games/${code}/tasks/sh/in/${uid}`).set({t:now()}).then(()=>toast('Eingecheckt'))}
  else db.ref(`games/${code}/players/${uid}/state`).set('safe').then(()=>toast('Evakuiert: Du bist in Sicherheit'))}
function rr(id){const k=G.tasks&&G.tasks[id];if(!k||Object.keys(k.in||{}).length)return;
  const n=(k.rr||0)+1,alt=Object.values(k.alt||{});if(n>alt.length)return toast('Keine weiteren Orte verfügbar');
  db.ref(`games/${code}/tasks/${id}`).update({rr:n,loc:alt[n-1]})}
function useImm(id,sec){const m=P()[uid]||{};if((m.immUntil||0)>now())return toast('Schutz läuft bereits');
  db.ref(`games/${code}/players/${uid}`).update({immUntil:now()+sec*1000,['used/'+id]:true}).then(()=>toast('Immunität aktiv'))}
function hTasks(g,t){let h='';const T=g.tasks||{},im=g.s.imm||120;
  ['sh','ev'].forEach(id=>{const k=T[id];if(!k||t<k.t0)return;
    const d=pos?Math.round(D(pos,k.loc)):null,near=d!==null&&d<=40,ins=Object.keys(k.in||{}),
      btn=(txt,fn)=>`<button ${near?'':'class=g disabled'} onclick="${fn}">${txt}${near?'':(d===null?' (warte auf GPS)':' (noch '+d+' m)')}</button>`;
    if(id==='sh'){const r=rankOf(k.in,uid);
      if(r)h+=`<div class=tk><b>Safehouse</b><br><small>Eingecheckt, Platz ${r}${r>2?': leider ohne Belohnung':''}.</small></div>`;
      else if(ins.length>=2)h+=`<div class=tk><b>Safehouse</b><br><small>Beide Plätze sind vergeben.</small></div>`;
      else h+=`<div class=tk><b>Safehouse</b><br><small>Erreiche den markierten Ort vor den anderen. Frei: ${2-ins.length} von 2. Platz 1: Immunität ${fmt(im*1000)}, Platz 2: ${fmt(im*500)}.</small><br>${btn('Einchecken',"chk('sh')")} <button class="s g" onclick="rr('sh')">Ort unpassend</button></div>`}
    else h+=`<div class=tk><b>Evakuierung</b><br><small>Erreiche den markierten Ort und bestätige, dann bist du in Sicherheit.</small><br>${btn('Evakuierung bestätigen',"chk('ev')")} <button class="s g" onclick="rr('ev')">Ort unpassend</button></div>`});
  return h}
function hInv(g,me_,t){const it=myItems(g),act=(me_.immUntil||0)>t;let h='';
  it.forEach(i=>{const used=me_.used&&me_.used[i.id];
    h+=`<div class=tk><b>Immunität</b> ${fmt(i.sec*1000)} `+(used?'<small>eingesetzt</small>':act?'<small>Schutz läuft noch</small>':`<button class="s" onclick="useImm('${i.id}',${i.sec})">Einsetzen</button>`)+`</div>`});
  return h?`<small>Inventar</small>`+h:''}
// Team-Chat (Hunter und Hider haben je einen eigenen Kanal)
let chRole=null,chRef=null,chOpen=false,chUnread=0,chSince=0;
function chBadge(){const b=$('cbn');b.textContent=chUnread;b.style.display=chUnread?'inline-block':'none'}
function chToggle(o){chOpen=o===undefined?!chOpen:o;$('chat').classList.toggle('open',chOpen);
  if(chOpen){chUnread=0;chBadge();const b=$('chm');b.scrollTop=b.scrollHeight}}
function chSend(){const i=$('chi'),x=i.value.trim().slice(0,200);if(!x||!code||!chRole)return;
  const m=P()[uid]||{};db.ref(`chats/${code}/${chRole}`).push({u:uid,n:(m.name||'Agent').slice(0,16),t:now(),x});i.value=''}
function chatSync(){const m=P()[uid],r=m&&m.role;$('cb').style.display=(code&&r)?'block':'none';
  if(!code||!r||r===chRole)return;
  if(chRef)chRef.off();
  chRole=r;$('chm').innerHTML='';chUnread=0;chBadge();$('cht').textContent='Team-Chat: '+(r==='hunter'?'Hunter':'Hider');chSince=now()-1000;
  chRef=db.ref(`chats/${code}/${r}`).limitToLast(50);
  chRef.on('child_added',sn=>{const c=sn.val();if(!c||typeof c.x!=='string')return;
    const d=document.createElement('div');d.className='m'+(c.u===uid?' me':'');
    const n=document.createElement('b');n.textContent=c.u===uid?'Du':String(c.n||'?');
    const x=document.createElement('span');x.textContent=c.x;d.append(n,x);
    const box=$('chm'),low=box.scrollHeight-box.scrollTop-box.clientHeight<60;box.appendChild(d);
    if(low||c.u===uid)box.scrollTop=box.scrollHeight;
    if(!chOpen&&c.u!==uid&&c.t>chSince){chUnread++;chBadge()}},()=>{})}
// Panel ziehen: folgt dem Finger, rastet beim Loslassen ein
{const P_=$('panel'),ph=$('ph');let y0=0,dy=0,on=0;
 const lim=()=>P_.offsetHeight-28;
 ph.addEventListener('pointerdown',e=>{on=1;y0=e.clientY;dy=0;P_.style.transition='none';ph.setPointerCapture(e.pointerId)});
 ph.addEventListener('pointermove',e=>{if(!on)return;dy=e.clientY-y0;const H=lim(),c=P_.classList.contains('c');
   P_.style.transform=`translateY(${Math.min(H,Math.max(0,(c?H:0)+dy))}px)`});
 const end=()=>{if(!on)return;on=0;const H=lim(),c=P_.classList.contains('c'),p=Math.min(H,Math.max(0,(c?H:0)+dy));
   P_.style.transition='';P_.style.transform='';
   if(Math.abs(dy)<6)P_.classList.toggle('c');else P_.classList.toggle('c',p>H/3)};
 ph.addEventListener('pointerup',end);ph.addEventListener('pointercancel',end)}
// Panel
function panel(force){const el=$('pb');
  if(!G){el.innerHTML=`<h2>Blown Cover</h2><input id=nm placeholder="Dein Name" value="${esc(me.name)}" maxlength=16>
  <button id=mkb style="width:100%" onclick="mk()">Neues Spiel erstellen</button>
  <div class=row><input id=cd placeholder="Code" maxlength=4 style="text-transform:uppercase"><button class=g onclick="jn()">Beitreten</button></div>
  <small id=gs>${pos?'GPS bereit ✓':'GPS wird beim Start angefragt'}</small>`;return}
  const g=G,me_=P()[uid]||{},host=g.host===uid,t=now(),run=g.status==='running'&&t>=rs(g);
  const tsk=me_.role==='hider'?JSON.stringify(Object.entries(g.tasks||{}).map(([k,v])=>[k,t>=v.t0,Object.keys(v.in||{}),v.rr,v.loc&&v.loc.lat,pos?Math.round(D(pos,v.loc)/10):null])):'';
  const sig=JSON.stringify([g.status,g.s,g.winner,g.host,run,Object.entries(P()).map(([k,p])=>[k,p.name,p.role,p.state]),g.catches&&Object.entries(g.catches).map(([k,c])=>[k,c.status]),cand,tsk,me_.used,(me_.immUntil||0)>t]);
  if(!force&&sig===lastSig)return;lastSig=sig;
  const pl=Object.entries(P());let h='';
  if(g.status==='lobby'){
    h=`<small>Spiel-Code</small> <span class=code>${esc(code)}</span>`+pl.map(([k,p])=>`<div class=pl><span>${esc(p.name)}${k===g.host?' 👑':''}</span><span>${k===uid?
      `<button class="s ${p.role==='hunter'?'':'g'}" onclick="setRole('hunter')">Hunter</button><button class="s ${p.role==='hider'?'':'g'}" onclick="setRole('hider')">Hider</button>`:(p.role==='hunter'?'Hunter':'Hider')}</span></div>`).join('');
    const sv=md(g)==='survive',F=(k,l,mn=1)=>`<label>${l}<input type=number min=${mn} value="${g.s[k]}" onchange="setS('${k}',this.value,${mn})"></label>`;
    h+=host?`<div class=row style="margin:8px 0 4px"><button class="${sv?'':'g'}" onclick="setMode('survive')">Untertauchen</button><button class="${sv?'g':''}" onclick="setMode('mission')">Mission</button></div>
      <small>${sv?'Hider überstehen die Zeit. Optional: Safehouse-Rennen um Immunität.':'Hider müssen zur Evakuierung, die kurz vor Spielende erscheint. Weitere Pflichtaufgaben folgen.'}</small>
      <p style="margin:6px 0"><small>Zone: roten Punkt ziehen oder Karte tippen.</small> <button class="s g" onclick="ctr()">Auf meine Position</button></p>
      <details><summary>Erweitert</summary><small>Zone</small><div class=g2>${F('r0','Startradius m')}${F('rMin','Min.-Radius m')}${F('shrink','Schrumpfen Min')}${F('head','Headstart Min')}</div>
      <small>Spiel</small><div class=g2>${F('dur','Dauer Min')}${F('ping','Ping alle Sek')}${F('pen','Strafzeit Min')}</div>
      <small>Aufgaben</small><div class=g2>${F('taskR','Aufgabenradius m (0 = auto)',0)}${F('imm','Immunität Sek')}${sv?`<label>Safehouse<select onchange="setB('shOn',this.value)"><option value=1 ${g.s.shOn?'selected':''}>An</option><option value=0 ${g.s.shOn?'':'selected'}>Aus</option></select></label>${F('shT','Safehouse ab Min',0)}`:F('evT','Evakuierung letzte Min')}</div></details>
      <div class=row style="margin-top:8px"><button id=stb onclick="st()">Spiel starten</button><button class=g onclick="fin()">Spiel beenden</button></div>`
      :`<p><small>Warte auf den Host… ${sv?'Untertauchen':'Mission'}, Zone ${g.s.r0} m, Dauer ${g.s.dur} Min, Ping alle ${g.s.ping} s.</small></p>`;
  }else if(g.status==='over'){
    h=`<h2>${g.winner==='hunter'?'Hunter gewinnen':'Hider gewinnen'}</h2>`+(host?`<button onclick="fin()">Daten löschen &amp; beenden</button>`:`<button class=g onclick="leave()">Verlassen</button>`);
  }else{
    const c=g.catches&&g.catches[uid];
    if(me_.state==='caught')h=`<h2>Du wurdest gefangen 🎯</h2><small>Schau von außen zu.</small>`;
    else if(me_.state==='dq')h=`<h2>Disqualifiziert (GPS-Signal verloren)</h2>`;
    else if(me_.state==='safe')h=`<h2>Du bist in Sicherheit</h2><small>Du kannst nicht mehr gefangen werden.</small>`;
    else if(me_.role==='hider'){h=`<h2>Du bist Hider</h2><small>${md(g)==='mission'?'Erreiche die Evakuierung, sobald sie erscheint, und lass dich nicht fangen.':'Bleib in der Zone und lass dich nicht fangen.'}</small>`;
      if(c&&c.status==='pending')h+=`<p><b>${esc((P()[c.hunter]||{}).name||'Ein Hunter')}</b> meldet, dich gefangen zu haben.</p><div class=row><button onclick="ok()">Ja, erwischt</button><button class=g onclick="no()">Nein</button></div>`;
      h+=hTasks(g,t)+hInv(g,me_,t)}
    else{h=`<h2>Du bist Hunter</h2>`;
      if(run)h+=cand.length?`<p>Wen hast du gefangen?</p>`+cand.map(([k,p])=>`<button style="width:100%" onclick="rq('${k}')">${esc(p.name)}</button>`).join(''):`<button style="width:100%" onclick="cc()">Fang melden</button>`;
      else h+=`<small>Warte auf das Ende des Headstarts.</small>`}
    if(host)h+=`<details><summary>Host-Menü</summary><button class=g onclick="endNow()">Spiel beenden</button></details>`;
  }
  const o=el.querySelector('details[open]');el.innerHTML=h;if(o){const d=el.querySelector('details');if(d)d.open=true}}

// Karte zeichnen
const dot=(ll,col,tip,r=8,op=1)=>L.circleMarker(ll,{radius:r,color:'#fff',weight:2,fillColor:col,fillOpacity:op,opacity:op}).bindTooltip(tip,{permanent:!!tip,direction:'top'}).addTo(lay);
function draw(){lay.clearLayers();if(!G)return;const g=G,t=now(),r=Rad(g,t),m=P()[uid]||{},c0=[g.c.lat,g.c.lng];
  const z=L.circle(c0,{radius:r,color:'#d62828',fillColor:'#d62828',fillOpacity:.07,weight:2}).addTo(lay);
  const key=r+(g.host===uid?'':c0.join());
  if(!fitted||(g.status==='lobby'&&key!==lastKey)){fitted=1;lastKey=key;map.fitBounds(z.getBounds())}
  if(g.status==='lobby'&&g.host===uid){
    if(!cm){cm=L.marker(c0,{draggable:true,icon:L.divIcon({className:'',html:'<div class=cm>✥</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);
      cm.on('dragstart',()=>drag=1);cm.on('dragend',()=>{drag=0;const p=cm.getLatLng();db.ref(`games/${code}/c`).set({lat:p.lat,lng:p.lng})})}
    else if(!drag)cm.setLatLng(c0)}
  else{if(cm){map.removeLayer(cm);cm=null}if(g.status==='lobby')dot(c0,'#d62828','Zentrum',5)}
  Object.entries(P()).forEach(([k,p])=>{if(!p.lat)return;const ll=[p.lat,p.lng];
    if(k===uid)return;
    if(p.role===m.role&&p.state==='alive')dot(ll,'#2a9d4a',esc(p.name));
    else if(m.role==='hunter'&&p.role==='hider'&&p.state==='alive'&&(p.out||p.revealUntil>t))dot(ll,'#e11','⚠ '+esc(p.name),10)});
  if(ping)Object.values(ping.pts).forEach(p=>dot([p.lat,p.lng],'#f77f00',m.role==='hunter'?esc(p.name)+' (Ping)':'Dein letzter Ping',m.role==='hunter'?9:14));
  if(ping&&ping.grey)Object.values(ping.grey).forEach(p=>dot([p.lat,p.lng],'#888',esc(p.name)+' (nicht ortbar)',9,.55));
  if(m.role==='hider'&&m.state==='alive'&&g.status==='running')['sh','ev'].forEach(id=>{const k=g.tasks&&g.tasks[id];
    if(!k||t<k.t0||(id==='sh'&&(Object.keys(k.in||{}).length>=2||(k.in&&k.in[uid]))))return;
    L.circle([k.loc.lat,k.loc.lng],{radius:40,color:'#7b2cbf',weight:2,fillColor:'#7b2cbf',fillOpacity:.15}).addTo(lay);
    dot([k.loc.lat,k.loc.lng],'#7b2cbf',id==='sh'?'Safehouse':'Evakuierung',7)});
  if(pos)dot([pos.lat,pos.lng],'#1e7cf0','',9)}

function onData(){
  if(G.status==='running'&&!onData.l){onData.l=1;lock()}
  panel();draw();chatSync()}

// Sekundentakt
setInterval(()=>{if(!G){return}const g=G,t=now(),m=P()[uid]||{};let h='';
  if(g.status==='lobby'){$('hud').innerHTML='';return}
  if(g.status==='over'){$('hud').innerHTML='<span>Spiel vorbei</span>';return}
  const R0=rs(g);
  if(t<g.startAt)h=`<span>Start in ${fmt(g.startAt-t)}</span>`;
  else if(t<R0)h=m.role==='hunter'?`<span>Hunter starten in ${fmt(R0-t)}</span>`:`<span>Headstart: noch ${fmt(R0-t)}</span>`;
  else{const el=t-R0,nextS=g.s.shrink*6e4-el%(g.s.shrink*6e4),nextP=g.s.ping*1000-el%(g.s.ping*1000);
    h=`<span>⏱ ${fmt(g.s.dur*6e4-el)}</span>`+(Rad(g,t)>g.s.rMin?`<span>${AR}${fmt(nextS)}</span>`:'')+`<span>Ping in ${fmt(nextP)}</span>`}
  // Hider: Zone & GPS
  if(m.role==='hider'&&m.state==='alive'&&t>=g.startAt){
    const gap=Date.now()-lastFix;
    if(gap>20000)h+=`<span class=w>GPS-Signal weg! DQ in ${Math.max(0,60-Math.floor(gap/1000))} s</span>`;
    if(gap>60000){db.ref(`games/${code}/players/${uid}/state`).set('dq')}
    if(pos){const out=D(pos,g.c)>Rad(g,t);
      if(out&&!wasOut){wasOut=true;db.ref(`games/${code}/players/${uid}`).update({out:true,revealUntil:0});write(1)}
      if(!out&&wasOut){wasOut=false;db.ref(`games/${code}/players/${uid}`).update({out:false,revealUntil:t+g.s.pen*6e4})}
      if(out)h+=`<span class=w>Außerhalb der Zone! Dein Standort ist sichtbar</span>`}}
  if(m.role==='hider'&&m.state==='alive'&&(m.immUntil||0)>t)h+=`<span>Schutz ${fmt(m.immUntil-t)}</span>`;
  if(m.role==='hider'&&m.state==='alive'){const vis=['sh','ev'].filter(id=>tv(g,id,t)).join();
    if(vis!==lastTV){const was=lastTV.split(',');lastTV=vis;
      vis.split(',').filter(x=>x&&!was.includes(x)).forEach(id=>{toast(id==='sh'?'Neue Aufgabe: Safehouse':'Evakuierung: Erreiche den Zielort!');navigator.vibrate&&navigator.vibrate([200,100,200])});
      draw();panel(1)}}
  // Hider: eigener letzter Ping
  if(m.role==='hider'&&m.state==='alive'&&t>=R0){const k=Math.floor((t-R0)/(g.s.ping*1000));
    if(k>=1&&k!==lastK){lastK=k;const q=P()[uid];
      if(q&&(q.immUntil||0)>t)toast('Ping ausgesetzt: Du bist geschützt');
      else if(q&&q.lat){ping={k,pts:{[uid]:{lat:q.lat,lng:q.lng,name:q.name}}};navigator.vibrate&&navigator.vibrate(150);toast('Ping gesendet: Hunter sehen deinen Standort');draw()}}}
  // Hunter: Ping-Snapshot
  if(m.role==='hunter'&&t>=R0){const k=Math.floor((t-R0)/(g.s.ping*1000));
    if(k>=1&&k!==lastK){lastK=k;ping={k,pts:{},grey:{}};const nm=[];
      Object.entries(P()).forEach(([id,p])=>{if(p.role!=='hider'||p.state!=='alive')return;
        if((p.immUntil||0)>t){nm.push(p.name);if(lk[id])ping.grey[id]=lk[id]}
        else if(p.lat){ping.pts[id]={lat:p.lat,lng:p.lng,name:p.name};lk[id]=ping.pts[id]}});
      navigator.vibrate&&navigator.vibrate(300);toast(nm.length?'📡 Ping! Nicht ortbar: '+nm.join(', '):'📡 Ping!');draw()}}
  // Fang-Anfragen
  Object.entries(g.catches||{}).forEach(([k,c])=>{if(c.hunter!==uid)return;
    if(c.status==='denied'){toast((P()[k]||{}).name+' hat den Fang abgelehnt');db.ref(`games/${code}/catches/${k}`).remove()}
    else if(c.status==='pending'&&t-c.t>30000){const p=P()[k];
      if(p&&pos&&p.lat&&D(pos,p)<=50){db.ref(`games/${code}/players/${k}/state`).set('caught');db.ref(`games/${code}/catches/${k}/status`).set('done')}
      else db.ref(`games/${code}/catches/${k}/status`).set('denied')}});
  // Spielende (nur Host schreibt)
  if(g.host===uid&&t>=R0){const hs=Object.values(P()).filter(p=>p.role==='hider'),alive=hs.filter(p=>p.state==='alive').length,safe=hs.filter(p=>p.state==='safe').length;
    if(!alive)db.ref('games/'+code).update({status:'over',winner:safe?'hider':'hunter'});
    else if(t-R0>=g.s.dur*6e4)db.ref('games/'+code).update({status:'over',winner:missionOk(g)?'hider':'hunter'})}
  $('hud').innerHTML=h;panel()},1000);

firebase.auth().signInAnonymously().then(u=>{uid=u.user.uid;
  if(localStorage.c){startGPS();join(localStorage.c)}else panel()}).catch(e=>{$('panel').innerHTML='<h2>Anmeldefehler</h2>'+esc(e.message)});
panel();
</script></body></html>
