      Object.entries(P()).forEach(([id,p])=>{if(p.role!=='hider'||p.state!=='alive')return;
        if((p.immUntil||0)>t){nm.push(p.name);if(lk[id])ping.grey[id]=lk[id]}
        else if(p.lat){ping.pts[id]={lat:p.lat,lng:p.lng,name:p.name};lk[id]=ping.pts[id]}});
      navigator.vibrate&&navigator.vibrate(300);toast(nm.length?'📡 Ping! Nicht ortbar: '+nm.join(', '):'📡 Ping!');psave();draw()}}}
  // Fang-Anfragen
  {const c=(g.catches||{})[uid];if(c&&c.status==='pending'){const hq=P()[c.hunter];if(!hq||hq.state!=='alive')db.ref(`games/${code}/catches/${uid}`).remove().catch(()=>{})}}
  Object.entries(g.catches||{}).forEach(([k,c])=>{if(c.hunter!==uid||m.state!=='alive')return;
    if(c.status==='denied'){toast(CW[c.why]||((P()[k]||{}).name+' hat den Fang abgelehnt'));db.ref(`games/${code}/catches/${k}`).remove()}
    else if(c.status==='pending'&&t-c.t>30000){const p=P()[k],why=catchWhy(p,t);
      if(!why){db.ref(`games/${code}/players/${k}`).update({state:'caught',sT:now()});db.ref(`games/${code}/catches/${k}/status`).set('done')}
      else db.ref(`games/${code}/catches`).child(k).update({status:'denied',why})}});
  // Spielende: jeder Mitspieler prüft, das erste gültige Schreiben gewinnt
  if(m.role&&t>=R0&&t>=endLock){const hs=Object.values(P()).filter(p=>p.role==='hider'),alive=hs.filter(p=>p.state==='alive').length,safe=hs.filter(p=>p.state==='safe').length,hu=Object.values(P()).filter(p=>p.role==='hunter'),huA=hu.filter(p=>p.state==='alive').length;
    const w=!alive?(safe&&missionOk(g)?'hider':'hunter'):(hu.length&&!huA?'hider':(t-R0>=g.s.dur*6e4?(missionOk(g)?'hider':'hunter'):null));
    if(w){endLock=t+4000;db.ref('games/'+code).update({status:'over',winner:w}).catch(()=>{})}}
  $('hud').innerHTML=h;panel()},1000);

(TEST?firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION):Promise.resolve()).then(()=>firebase.auth().signInAnonymously()).then(u=>{uid=u.user.uid;
  if(LS.c){startGPS();join(LS.c)}else panel()}).catch(e=>{$('panel').innerHTML='<h2>Anmeldefehler</h2>'+esc(e.message)});
panel();
setInterval(()=>{if(G&&G.status==='lobby')panel()},3000);
</script></body></html>
