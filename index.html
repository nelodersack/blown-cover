<style>
/* §CSS-BASIS Farben (Tokens), Grundelemente */
:root{--bg:#16191c;--panel:#1e2125;--panel2:#272b30;--line:#363b42;--line2:#2e3238;--fg:#e4e2dd;--mut:#9ca1a8;--sel:#3b4148;--ac:#e5484d;--danger:#e5484d;--ok:#3fb56a;--ping:#ff8a1f;--xping:#ffb03b;--live:#ff5f1f;--task:#7c6cff;--cmp:#e2459b;--grey:#7a8696;
--f-d:'Barlow Condensed','Arial Narrow',sans-serif;--f-b:'Barlow',system-ui,sans-serif;--f-m:'Barlow',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;font:15px/1.4 var(--f-b);background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
#map{position:fixed;inset:0}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;z-index:1000;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;pointer-events:none}
#hud span{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--panel) 95%,transparent);padding:6px 11px;border-radius:999px;font:500 13px var(--f-m)}
#hud .w{background:var(--danger);font-family:var(--f-b);font-weight:600}
#hud .ic{width:15px;height:15px}
#hud span.hp{display:grid;justify-items:center;gap:0;padding:4px 11px 5px;border-radius:10px;min-width:70px;font:500 14px/1.25 var(--f-m)}
#hud .hp small{font:600 9.5px/1.3 var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
#hud .hp.hot{background:#ff8a1f;color:#1a0d00;animation:hpPulse 1.6s ease-in-out infinite}#hud .hp.hot small{color:#3d2200}
@keyframes hpPulse{50%{background:#ffa64d}}@media (prefers-reduced-motion:reduce){#hud .hp.hot{animation:none}}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:1000;max-height:56vh;display:flex;flex-direction:column;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);transition:transform .25s ease,max-height .25s ease,height .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
#panel.tall{max-height:80vh}#panel.c{transform:translateY(calc(100% - 34px))}#panel.m{transform:translateY(var(--mid,0px))}#panel.m #ps::after{content:'';display:block;height:var(--pad,0px)}
#ph{padding:10px 0 8px;cursor:grab;touch-action:none;flex:none}#ph i{display:block;width:44px;height:5px;border-radius:3px;background:#3a3f46;margin:0 auto}
#ps{overflow:auto;flex:1;min-height:0;overscroll-behavior:contain}
#pb{padding:0 14px 14px;display:grid;gap:10px;align-content:start;grid-auto-rows:max-content}
#pf{padding:10px 14px 12px;border-top:1px solid var(--line);display:grid;gap:6px}#pf:empty{display:none}
/* §CSS-ELEMENTE Überschriften, Buttons, Eingaben */
h2{font:700 26px/1.05 var(--f-d);text-transform:uppercase;letter-spacing:.03em;margin:0}
h3{font:700 12px var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:4px 0 0}
p{margin:0}small,.mut{color:var(--mut)}.sm{font-size:13px}
button,input,select{font:inherit}
button{font:600 15px var(--f-b);border-radius:10px;border:1px solid transparent;padding:10px 14px;min-height:46px;cursor:pointer;background:var(--fg);color:var(--bg);margin:2px 0;display:inline-flex;gap:8px;align-items:center;justify-content:center}
button:not(.s):not(.n):not(.ghost):not(.sw):not(.tile){width:100%}
button.g{background:none;color:var(--fg);border-color:#3a3f46}button.s{min-height:34px;padding:4px 11px;font-size:13px;margin:0 2px;border-radius:9px;width:auto}
button.ghost{background:none;color:var(--mut);border:0;font-weight:500;min-height:40px;font-size:13px;white-space:nowrap;padding:8px 6px}
button.dng{background:var(--danger);color:#fff}button:disabled{background:var(--panel2);color:var(--mut);border-color:var(--line);cursor:not-allowed;opacity:1}
button .ic{width:18px;height:18px}
#stb{isolation:isolate;position:relative;overflow:hidden}
#stb.busy:disabled{background:linear-gradient(90deg,#fff var(--p,0%),var(--panel2) var(--p,0%));border-color:var(--line)}
#stb.busy span{color:#fff;mix-blend-mode:difference}
input{font:500 16px var(--f-b);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px;margin:3px 0}
select{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--xping);outline-offset:2px}
/* §CSS-KOMPONENTEN card/tk, chip, pl, seg, tiles, acc, fl(.sub), num, sw, rl */
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}.row.sp{justify-content:space-between}
.ic{width:20px;height:20px;display:inline-block;vertical-align:middle;flex:none}
.logo{font:700 44px/.9 var(--f-d);text-transform:uppercase;letter-spacing:.02em}.logo span{color:var(--danger)}
.code{font:500 28px var(--f-m);letter-spacing:.3em}
.card,.tk{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:0;display:grid;gap:8px}
.hd{display:flex;gap:9px;align-items:center;font-weight:600}.tk .hd .ic,.card .hd .ic{color:var(--task);width:20px;height:20px}
.strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--f-b);padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.chip .ic{width:13px;height:13px}.chip.ok{color:var(--ok);border-color:#3fb56a55}.chip.or{color:var(--ping);border-color:#ff8a1f55}.chip.big{font-size:13px;padding:4px 11px;color:var(--fg)}
.pl{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.av{width:34px;height:34px;border-radius:50%;background:#2a2e34;display:grid;place-items:center;font:700 16px var(--f-d);flex:none}
.pl .nm{flex:1;font-weight:600;display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}.pl .nm .ic{width:16px;height:16px;color:var(--xping)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--fg);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.seg,.tabs2{display:flex}.seg{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--mut);font:600 13px var(--f-b);padding:6px 11px;border-radius:7px;min-height:34px;margin:0;width:auto}.seg button.on{background:var(--fg);color:var(--bg)}
.tabs2{gap:6px}.tabs2 button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--mut);padding:9px;border-radius:10px;font:600 14px var(--f-b);min-height:42px;margin:0}.tabs2 button.on{background:var(--fg);color:var(--bg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;color:var(--fg);display:grid;gap:3px;font:inherit;justify-content:stretch;align-items:start;margin:0;min-height:0}
.tile b{font:700 18px var(--f-d);text-transform:uppercase;letter-spacing:.03em}.tile span{font-size:12px;color:var(--mut);font-weight:400}.tile.on{border-color:var(--fg);background:#23272c}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pre button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 2px;display:grid;gap:0;font:600 12px var(--f-b);min-height:52px;margin:0;justify-content:center}.pre b{font:700 20px var(--f-d)}.pre button.on{border-color:var(--fg);background:#23272c}
.acc{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.acc>button{width:100%;background:var(--panel2);color:var(--fg);border:0;border-radius:0;padding:11px 12px;display:flex;justify-content:flex-start;text-align:left;font:600 14px var(--f-b);min-height:48px;margin:0}
.acc>button small{display:block;font-weight:400;font-size:12px}.acc>button .ic{width:18px;height:18px;color:var(--mut)}.acc>button>span{flex:1}.acc>button>span.chv{flex:none;display:grid;color:var(--mut)}.acc>button>span.chv .ic{width:14px;height:14px}
.acc.li>button{align-items:center;gap:10px}.acc.li>button>span.v{flex:none;font:500 12px var(--f-m);color:var(--mut);white-space:nowrap}
.balw{font:500 13px var(--f-b);color:var(--xping);display:inline-flex;gap:7px;align-items:center}.balw i{width:8px;height:8px;border-radius:50%;background:var(--xping);flex:none}
.grp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid}.grp>.acc{border:0;border-radius:0;border-top:1px solid var(--line2)}.grp>.acc:first-child{border-top:0}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 -2px;font:700 12px var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}.gh small{font:400 12px var(--f-b);letter-spacing:0;text-transform:none}
.acc .in{padding:4px 12px 10px;display:grid;background:var(--panel)}
.fl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);min-height:48px}.fl:last-child{border:0}.fl.sub{margin-left:10px;padding-left:12px;border-left:2px solid var(--line)}.fl.sub label{color:var(--mut)}.fl:has(+.fl.sub){border-bottom-color:transparent}.fl label{font-size:14px}.fl small{display:block;font-size:12px}
.num{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;flex:none}
.num button.n{background:none;color:var(--fg);border:0;width:36px;height:38px;min-height:0;padding:0;margin:0;font:600 20px var(--f-b);display:block}
.num input{width:62px;text-align:center;border:0;background:none;font:500 14px var(--f-m);padding:0;margin:0;min-height:38px;border-radius:0;-moz-appearance:textfield}.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num .u{font:500 12px var(--f-m);color:var(--mut);margin-right:2px;min-width:0}
.sw{width:50px;height:30px;min-height:0;border-radius:999px;background:#2f343a;border:0;position:relative;padding:0;margin:0;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.rl{padding:6px 0;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px}.rl small{text-align:right}
.cm{width:30px;height:30px;border-radius:50%;background:var(--danger);border:3px solid #fff;color:#fff;text-align:center;line-height:24px;font-size:16px;box-shadow:0 1px 6px #0006}
.lcode{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px 12px}.lcode>div{flex:1}.lcode h3{margin:0}
button.lib{width:40px!important;height:40px;min-height:0!important;padding:0!important;margin:0!important;border-radius:10px!important;background:var(--bg)!important;color:var(--fg)!important;border:1px solid var(--line)!important;display:grid;place-items:center;flex:none}button.lib .ic{width:18px;height:18px}
.lcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lcol{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.lcol h4{margin:0 0 2px;font:700 12px var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
.lchip{display:flex!important;align-items:center;gap:7px;background:var(--bg)!important;border:1px solid var(--line)!important;border-radius:999px!important;padding:4px 10px 4px 4px!important;margin:0!important;font:600 13px var(--f-b)!important;color:var(--fg)!important;min-height:0!important;width:100%;text-align:left;min-width:0}
.lchip .av{width:26px;height:26px;font-size:13px}.lchip .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lchip .ic{width:14px;height:14px;color:var(--xping);flex:none}.lchip .spin{width:14px;height:14px;flex:none}
.lchip.me{border-color:var(--fg)!important}.lchip.ng{border-color:var(--danger)!important}
button.lsw{background:none!important;border:1px dashed #3a3f46!important;color:var(--mut)!important;min-height:34px!important;font-size:12px!important;border-radius:999px!important;margin:0!important;padding:4px 8px!important}
.lnote{display:block;text-align:center;color:var(--mut);font-size:12px}
/* §CSS-FANG Fang melden (Raster), Fang-Alarm beim Hider (#fa) */
.cgr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button.cgt{display:grid!important;justify-items:center;gap:6px;padding:12px 4px!important;margin:0!important;background:var(--panel2)!important;border:1px solid var(--line)!important;border-radius:10px!important;color:var(--fg)!important;min-width:0}
.cwt{border-color:#e5484d88}.cwt .cwn{font:700 20px var(--f-m);color:var(--danger)}button.cgt.off{opacity:.45}button.cgt small{font-size:11px;color:var(--mut)}
button.cgt .av{width:44px;height:44px;font-size:20px}button.cgt b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fa{position:fixed;inset:0;z-index:2400;background:color-mix(in srgb,var(--panel) 92%,transparent);display:none;place-items:center;padding:20px}#fa.on{display:grid}
#fa .fb{width:100%;max-width:360px;background:var(--panel);border:1px solid #e5484d88;border-radius:16px;padding:22px 18px 16px;display:grid;gap:12px;justify-items:center;text-align:center;box-shadow:0 0 0 6px #e5484d22}
#fa .fe{font:700 12px var(--f-b);letter-spacing:.12em;color:var(--danger)}
#fa .fr{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--danger) 0 var(--p),#ffffff14 var(--p) 100%);display:grid;place-items:center}
#fa .fr>div{width:80px;height:80px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:700 30px var(--f-m)}
#fa .ft{font-size:19px;font-weight:700;line-height:1.25}#fa .fs{font-size:13px;color:var(--mut)}
#fa .row{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}#fa .row button{margin:0}#fa button.fy{background:var(--danger);color:#fff}
/* §CSS-FANG-STARTEN „Festsetzen“ in Orange: Knopf (fsb), Karten (fzh), Hider-Alarm (#fz, unter dem Fang-Alarm #fa) */
.fsrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fsrow button{margin:0}
button.fsb{background:transparent!important;border:1.5px solid var(--xping)!important;color:var(--xping)!important}button.fsb[disabled]{opacity:.55}
.card.fzh{border-color:#ffb03b88}.card.fzh .fzn{font:700 20px var(--f-m);color:var(--xping)}.card.fzh .av{width:34px;height:34px;font-size:16px;flex:none}
.chip.fzc{color:var(--xping);border-color:#ffb03b88;background:#ffb03b14}
#fz{position:fixed;inset:0;z-index:2300;background:color-mix(in srgb,var(--panel) 92%,transparent);display:grid;place-items:center;padding:20px}
#fz .fb{width:100%;max-width:360px;background:var(--panel);border:1px solid #ffb03b99;border-radius:16px;padding:22px 18px 16px;display:grid;gap:12px;justify-items:center;text-align:center;box-shadow:0 0 0 6px #ffb03b22;animation:fzp 1s ease-in-out infinite}
@keyframes fzp{50%{box-shadow:0 0 0 14px #ffb03b14}}@media (prefers-reduced-motion:reduce){#fz .fb{animation:none}}
#fz .fe{font:700 12px var(--f-b);letter-spacing:.12em;color:var(--xping)}
#fz .fr{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--xping) 0 var(--p),#ffffff14 var(--p) 100%);display:grid;place-items:center}
#fz .fr>div{width:80px;height:80px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:700 30px var(--f-m)}
#fz .ft{font-size:19px;font-weight:700;line-height:1.25}#fz .fs{font-size:13px;color:var(--mut)}
#fz .who{display:flex;gap:8px;align-items:center;justify-content:center}#fz .who .av{width:30px;height:30px;font-size:15px}
#fz button.fy{background:var(--xping);color:#1a1205;width:100%;margin:0}
/* §CSS-BEWEGUNG weiches Einblenden für alles, was über der Karte erscheint (Fenster, Alarme, Legende, Menüs, Meldungen); aus bei „Bewegung reduzieren“.
   Animiert wird nur der bleibende Rahmen, nicht der Inhalt (der wird bei jedem panel() neu gesetzt und würde sonst flackern) */
@keyframes ovin{from{opacity:0;transform:scale(1.03)}}@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.96)}}@keyframes tout{to{opacity:0;transform:translateY(-6px)}}@keyframes upin{from{transform:translateY(40px);opacity:0}}
#dlg,#bnd,#gd,#bfd,#res,#fa.on,#fz{animation:ovin .16s ease-out}
#lg.open{animation:popin .14s ease-out;transform-origin:top left}#mmn.open{animation:popin .14s ease-out;transform-origin:top right}
#chat{animation:upin .2s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){#dlg,#bnd,#gd,#bfd,#res,#fa.on,#fz,#lg.open,#mmn.open,#chat,#toast .t,#toast .t.out{animation:none}}
/* §CSS-ZUSCHAUER kompakte Zeilen (zr) mit Aufgaben-Quadraten (zs) und Bonus-Kreisen (zc) */
button.zr{display:grid!important;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 12px!important;margin:0!important;background:none!important;border:0!important;border-top:1px solid var(--line2)!important;border-radius:0!important;color:var(--fg)!important;text-align:left;width:100%;min-height:52px}
.grp>button.zr:first-child{border-top:0!important}button.zr .av{width:30px;height:30px;font-size:14px}
.zn{display:grid;gap:4px;min-width:0}.zn b{font-size:14px}.zi{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.zi small{color:var(--mut);font-size:12px}
.zs,.zc{width:20px;height:20px;display:grid;place-items:center;border:1.5px solid var(--task);color:var(--task);border-radius:6px}.zc{border-radius:50%;border-color:#4fb3f0;color:#4fb3f0}
.zs .ic,.zc .ic{width:12px;height:12px}.zs.done{background:var(--task);color:#fff}.zc.done{background:#4fb3f0;color:#04121c}
.zs.off,.zc.off{border-color:var(--line);color:var(--mut)}.zs.run{animation:hpPulse2 1.4s ease-in-out infinite}@keyframes hpPulse2{50%{background:#7c6cff55}}
.zst{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap}.zst.ok{color:var(--ok)}.zst.safe{color:#4fb3f0}.zst.hu{color:#4fb3f0}.zst.bad{color:var(--danger)}
.zd{padding:0 12px 10px 52px;font-size:12.5px;color:var(--mut);line-height:1.5}
.tiles.t3{grid-template-columns:repeat(3,1fr);gap:6px}.tiles.t3 .tile{padding:9px 8px}.tiles.t3 .tile b{font-size:16px}.tiles.t3 .tile span{font-size:11.5px;line-height:1.3}
.tile.zt.on{border-color:#58c322;box-shadow:inset 0 0 0 1px #58c322}
.lrnd{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px!important}

.rsop{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 10px;font:600 14px var(--f-b);color:var(--mut);text-align:center}

#res{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:#000b;padding:16px}

/* §CSS-REPLAY Zeitleiste (tl), Statistik (aw/al) */
/* Zeitleiste „Lupe“: oben Übersicht der ganzen Runde (tlo), darunter Detailspur mit 10/20 Min um die aktuelle Position (tld), Filter-Chips (rvch) */
.tlo{position:relative;height:22px;margin:4px 0 0;touch-action:none;cursor:pointer}.tlo .bar,.tlo .fill{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:#2a2e34}.tlo .bar{right:0}.tlo .fill{background:#5c6168}
.tlo .t{position:absolute;top:7.5px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;pointer-events:none}.tlo .t.sq{border-radius:2px}.tlo .t.hu{border-radius:0;width:8px;height:7px;margin-left:-4px;clip-path:polygon(50% 0,100% 100%,0 100%)}.tlo .win{position:absolute;top:1px;height:20px;border:1.5px solid var(--fg);border-radius:6px;background:#edece81a;pointer-events:none;box-sizing:border-box}
.tld{position:relative;height:64px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden;touch-action:none;cursor:grab}.tld .st{position:absolute;top:0;bottom:0;left:0;will-change:transform;pointer-events:none}
.tld .bar{position:absolute;left:0;right:0;top:25px;height:4px;background:#2a2e34}.tld .ev{position:absolute;top:16px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--bg);border:2px solid var(--c);color:var(--c);display:grid;place-items:center;box-sizing:border-box}.tld .ev .ic{width:12px;height:12px;stroke-width:2.4}.tld .ev.sq{border-radius:7px}.tld .ev.hu{border:0;background:none;width:28px;height:25px;margin-left:-14px;top:12px;align-content:end;padding-bottom:4px}.tld .ev.hu .tri{position:absolute;inset:0;width:100%;height:100%}.tld .ev.hu .ic{position:relative;width:11px;height:11px}.rvch .ci{display:grid}
.tld .pg{position:absolute;top:20px;width:2px;height:14px;margin-left:-1px;border-radius:1px;background:#5c6168}.tld .rvzs{position:absolute;top:14px;width:3px;height:26px;margin-left:-1.5px;border-radius:1.5px;background:#5c6168}
.tld .mt{position:absolute;bottom:17px;width:1px;height:4px;background:#3a3f46}.tld .mt.b{height:7px;background:#5c6168}.tld .lb{position:absolute;bottom:3px;transform:translateX(-50%);font:500 10px var(--f-m);color:var(--mut);white-space:nowrap}
.tld .ph{position:absolute;top:5px;bottom:18px;width:2px;margin-left:-1px;background:var(--fg);border-radius:1px;pointer-events:none;box-shadow:0 0 0 2px var(--bg)}
.rvch{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}.rvch::-webkit-scrollbar{display:none}.rvch .chip{flex:none}.rvch .rvtr{border-style:dashed}.rvch .chip{cursor:pointer;user-select:none;-webkit-user-select:none}.rvch .chip i{width:8px;height:8px;border-radius:50%;display:inline-block}.rvch .chip b{color:var(--fg);font-weight:600}.rvch .chip.off{opacity:.4}
.ctl{display:flex;gap:8px;align-items:center}.ctl .pp{width:44px!important;height:44px;min-height:0!important;border-radius:50%!important;padding:0!important;display:grid;place-items:center;flex:none!important;background:var(--fg);color:var(--bg);border:0;font-size:15px}
.rvtab{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}.rvtab button{flex:1;background:none;border:1px solid transparent;color:var(--mut);border-radius:9px;min-height:32px;margin:0;font-size:13px;padding:0}.rvtab button.on{color:var(--fg);border-color:var(--fg);background:var(--panel2)}
.aw2{border-bottom:1px solid var(--line2)}.aw{display:grid;grid-template-columns:34px 1fr auto 16px;gap:10px;align-items:center;padding:9px 0;cursor:pointer}.aw .e{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--panel2);color:var(--fg)}.aw .e svg{width:19px;height:19px}
.aw b{display:block;color:var(--fg);font-size:14px}.aw small{color:var(--mut)}.aw .v{display:grid;justify-items:end;gap:3px;font:700 16px var(--f-d);color:var(--fg)}.cv{display:grid;color:var(--mut)}.cv .ic{width:16px;height:16px}
.jp{width:auto!important;min-height:0!important;padding:2px 8px!important;border-radius:999px!important;font:600 11px var(--f-b)!important;background:#1e7cf022!important;color:#7fb2ff!important;border:1px solid #1e7cf055!important;flex:none;margin:0}
.al{display:grid;gap:2px;padding:0 0 10px 44px}.ar{display:grid;grid-template-columns:18px 1fr auto 62px;gap:8px;align-items:center;font-size:13px;min-height:28px}.ar .rk{color:var(--mut);font-size:12px}.ar .nm{color:var(--fg)}.ar .vv{color:var(--fg);font-weight:600}.ar .jp{justify-self:end}

/* §CSS-KNOEPFE Runde Symbol-Knöpfe, Blickrichtungspfeil (meh), Kompass (nb) */
#cb,#mmbtn,#lgb{width:40px!important;height:40px;min-height:0!important;padding:0!important;border-radius:50%!important;place-items:center}#cb .ic,#mmbtn .ic,#lgb .ic{width:22px;height:22px}#cb{position:fixed}#cbn{position:absolute;top:-3px;right:-3px;margin:0!important;min-width:18px;line-height:18px;text-align:center;padding:0 5px!important}

.meh{position:absolute;left:0;top:0;width:36px;height:36px;transform-origin:18px 18px;pointer-events:none}.meh svg{width:36px;height:36px;display:block;overflow:visible;filter:none}
.leaflet-tooltip-top{transform-origin:50% calc(100% + 6px)}
#nb{position:fixed;left:10px;top:calc(156px + env(safe-area-inset-top,0px));z-index:999;display:none;width:40px;height:40px;min-height:0;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--panel) 92%,transparent);place-items:center}#nb svg{width:26px;height:26px;display:block}#nb svg.l{width:22px;height:22px}#nbt{position:fixed;left:58px;top:calc(163px + env(safe-area-inset-top,0px));z-index:1300;display:none;background:color-mix(in srgb,var(--panel) 95%,transparent);color:var(--fg);font:600 12px var(--f-b);padding:6px 10px;border-radius:999px;pointer-events:none}

/* §CSS-UPDATE Knopf „App laden/Update“ auf der Karte (Startbildschirm, Platz des Chat-Knopfs), oranger Punkt = Update verfügbar */
#upb{position:fixed;right:10px;top:calc(60px + env(safe-area-inset-top,0px));z-index:1200;display:none;width:40px!important;height:40px;min-height:0!important;padding:0!important;place-items:center;border-radius:10px!important;background:var(--panel)!important;border:1px solid var(--line)!important;color:var(--fg)}
#upb .ic{width:22px;height:22px}
#upb i{display:none;position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--ping);border:2px solid var(--bg)}
#upb.new i{display:block}
/* Replay-Flug: Markierungen und Zonen während des Flugs ausgeblendet (sonst verpixelt), danach einblenden */
#map .leaflet-overlay-pane,#map .leaflet-marker-pane{transition:opacity .35s}
#map.fly .leaflet-overlay-pane,#map.fly .leaflet-marker-pane{opacity:0;transition:opacity .15s}
/* §CSS-KARTENSTIL Schild der Kartenstil-Vorschau */
#ksb{position:fixed;left:10px;top:calc(60px + env(safe-area-inset-top,0px));z-index:1300;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;color:var(--fg);font:500 13px var(--f-b);box-shadow:0 4px 14px rgba(0,0,0,.35)}
#ksb button{width:32px!important;height:32px;min-height:0!important;padding:0!important;margin:0!important;background:var(--panel2)!important;border:0!important;border-radius:8px!important;color:var(--fg)!important;font-size:18px}
#ksb span{padding:0 6px;white-space:nowrap}
/* §CSS-LAGEBERICHT Log-Knopf #lgk (wie Chat/Marker), Seitenleiste #blg, Ping-Etikett .blpt */
#lgk{position:fixed;right:10px;top:calc(156px + env(safe-area-inset-top,0px));z-index:1200;display:none;width:40px!important;height:40px;min-height:0!important;padding:0!important;place-items:center;color:var(--fg);border-radius:10px!important;background:var(--panel)!important;border:1px solid var(--line)!important}
#lgk .ic{width:22px;height:22px}#lgk i{display:none;position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--panel)}#lgk.new i{display:block}
#blg{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));right:58px;width:calc(100% - 116px);max-width:340px;max-height:58vh;z-index:2500;background:#1b1e22;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px #000a;padding:12px 12px 4px;color:var(--fg);display:flex;flex-direction:column;transform-origin:top right;transform:scale(.96);opacity:0;transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .18s;visibility:hidden}   /* Karte am Knopf (Manuels Wahl, Variante 1) */
#blg.on{transform:none;opacity:1;visibility:visible}
#blg .blh{display:flex;align-items:center;gap:8px}#blg .blh b{font-size:17px;flex:1}
#blg .blt{display:flex;background:var(--bg);border-radius:999px;padding:3px}#blg .blt button{width:auto;min-height:0;margin:0;padding:4px 11px;border-radius:999px;font:600 12.5px var(--f-b);color:var(--mut);background:none;border:0}#blg .blt button.on{background:var(--fg);color:var(--bg)}
#blg .blx{width:30px;height:30px;min-height:0;margin:0;padding:0;border-radius:50%;background:var(--panel2);border:0;color:var(--mut);font-size:14px}
#blg .blf{display:flex;gap:6px;margin:12px 0 6px;overflow-x:auto;scrollbar-width:none;flex:none}#blg .blf::-webkit-scrollbar{display:none}
#blg .blf button{flex:none;width:auto;min-height:0;margin:0;font:600 12px var(--f-b);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mut);display:flex;gap:5px;align-items:center}#blg .blf button.on{color:var(--fg);border-color:var(--fg)}#blg .blf .ic{width:12px;height:12px}
#blg .bll{overflow-y:auto;flex:0 1 auto;min-height:0;padding-bottom:6px}   /* Leiste nur so hoch wie der Inhalt (Manuel 22.11.) */
#blg .blr:last-child{border-bottom:0}
#blg .blr{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line2);font-size:13px}#blg .blr .t{width:38px;color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums;flex:none}
#blg .blr>.ic{width:14px;height:14px;color:var(--c);flex:none}#blg .blr .x{flex:1;min-width:0;line-height:1.3}#blg .blr .x small{color:var(--mut)}
#blg .blr.tap{cursor:pointer}#blg .blr .go{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
#blg .bls{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}#blg .bls div{padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}#blg .bls div:nth-child(2n){border-right:0}#blg .bls div:nth-last-child(-n+2){border-bottom:0}
#blg .bls small{display:block;color:var(--mut);font-size:11px}#blg .bls b{font:700 17px var(--f-d)}
#blg h4{margin:12px 0 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
#blg .q{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:13.5px}#blg .q .n{flex:1;min-width:0}#blg .q .v{font:700 15px var(--f-d)}#blg .q small{color:var(--mut);font-size:11.5px}#blg .q.me .n{font-weight:700}#blg .q.out .n{color:var(--mut);text-decoration:line-through}
#blg .tri{width:12px;height:11px;flex:none}#blg .ci{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 1px #fff8}
#blg{overflow-y:auto}#blg>.q:last-child{margin-bottom:8px}
.blpt{display:flex;align-items:center;gap:5px;background:#1b1e22f0;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 7px;font:600 12px var(--f-b);color:var(--fg);white-space:nowrap;transform:translate(-50%,calc(-100% - 22px));width:max-content}.blpt .ic{width:13px;height:13px;color:#9ca1a8}
/* §CSS-CHAT-KARTE Chat als Karte am Knopf wie der Lagebericht (Manuel 22.11.); beim Tippen (.kb) breit über der Tastatur (--kbb Abstand unten, --kbh verfügbare Höhe aus visualViewport) */
#chat{left:auto;right:58px;top:calc(56px + env(safe-area-inset-top,0px));bottom:auto;width:calc(100% - 116px);max-width:340px;height:auto;max-height:58vh;border-radius:14px;border:1px solid var(--line);box-shadow:0 12px 34px #000a;background:#1b1e22;overflow:hidden}
#chh{padding:10px 10px 8px 12px;border-bottom:0}#chh>button{width:30px;height:30px;min-height:0;padding:0;border-radius:50%;color:var(--mut)}
#cht{background:var(--bg);border-radius:999px;padding:3px;gap:2px;flex-wrap:nowrap}#cht .s{border:0;background:none;padding:4px 10px;font-size:12.5px;border-radius:999px;opacity:1;color:var(--mut);min-height:0;margin:0;width:auto}
#cht .s.on{background:var(--fg);color:var(--bg)}
#chp{padding:2px 12px 0!important}#chm{flex:0 1 auto;padding:6px 12px}#chm .m{font-size:13.5px;padding:5px 9px}
#chq{padding:6px 10px 0}#chq button.qr{min-height:30px;padding:4px 10px;font-size:12px}
#chr{padding:8px 10px 10px}#chr input{min-height:38px;font-size:16px}#chr button#chs{width:38px;min-height:38px;height:38px}
#chat.kb{left:8px;right:8px;width:auto;max-width:none;top:auto;bottom:var(--kbb,8px);max-height:var(--kbh,60vh)}
/* §CSS-FENSTER verschiebbar/größenveränderbar: Griff .wrs (Ecke), ↺ .wrst nur bei eigener Lage (.cust); Lobby-Panel beim Tippen ausblenden */
#chh,.blh{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.drag #chh,.drag .blh{cursor:grabbing}.drag{transition:none!important}
.whb{display:flex;gap:6px;align-items:center;flex:none}.wrst{display:none!important}.cust .wrst{display:grid!important;place-items:center}.wrst .ic{width:15px;height:15px}
#chh .whb button{width:30px;height:30px;min-height:0;padding:0;margin:0;border-radius:50%;background:var(--panel2);border:0;color:var(--mut);display:grid;place-items:center}
.wrs{position:absolute;right:2px;bottom:2px;width:22px;height:22px;touch-action:none;cursor:nwse-resize;z-index:2;background:linear-gradient(135deg,transparent 52%,var(--mut) 52%,var(--mut) 58%,transparent 58%,transparent 70%,var(--mut) 70%,var(--mut) 76%,transparent 76%);opacity:.55;border-bottom-right-radius:12px}
#chat.kb .wrs{display:none}
#chat.cust #chm,#blg.cust .bll{flex:1 1 auto}
#chh,#chp,#chq,#chr,#blg .blh,#blg .blf{flex:none}#chm{min-height:0}
body.chkb #panel{visibility:hidden}
/* §CSS-REPLAY-SICHT Blickwinkel (rvv), Ergebniszeile (rvop), Funk-Karte (rvfk), Teampunkt (tdot) */
.rvh{margin:2px 0 0;font-size:24px;line-height:1.15}.rvop{display:block;margin-top:-6px}.rvop b{font-weight:600;color:var(--fg)}
.rvv{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px -14px 0;padding:0 14px}.rvv::-webkit-scrollbar{display:none}
.rvv button{flex:0 0 auto!important;width:auto!important;display:inline-flex;align-items:center;gap:6px;margin:0;min-height:34px;padding:0 12px;border-radius:999px;background:none;border:1px solid var(--line);color:var(--mut);font:600 13px var(--f-b);white-space:nowrap}
.rvv button .vs{width:12px;height:12px;flex:none}.rvv button b{font:700 13px var(--f-d);color:var(--fg);min-width:14px;height:18px;padding:0 5px;border-radius:9px;background:var(--panel2);display:grid;place-items:center}
.rvv button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}.rvv button.on b{background:var(--bg);color:var(--fg)}
.rvvh{display:block;color:var(--mut);font-size:12px;margin-top:-4px}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;box-shadow:0 0 0 1px #ffffff59}
.arsub{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.rvfk{padding:8px 12px 6px!important;gap:0!important}.rvfk .fkh{display:flex;align-items:center;gap:6px;font:600 11px var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}.rvfk .fkh .ic{width:13px;height:13px}
.fkl{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:baseline;width:100%;margin:0;padding:5px 0;min-height:0;background:none;border:0;border-top:1px solid var(--line2);border-radius:0;text-align:left;color:var(--fg);font:400 13.5px/1.35 var(--f-b)}
.fkm .fkl:first-child{border-top:0}.fkl .fkt{font:500 11.5px var(--f-b);color:var(--mut);font-variant-numeric:tabular-nums}.fkl .fkb{min-width:0}.fkl .fkb b{font-weight:600;margin-right:5px}.fkl .fks{width:10px;height:10px;margin-right:5px;vertical-align:-.5px}.fkl .fkb i{font-style:normal;font-size:11px;color:var(--mut);margin-right:6px}
.mkw.snap{opacity:.75}
.rvn{display:flex;align-items:center;gap:5px;background:#1b1e22f0;border:1.5px solid var(--c);border-radius:999px;padding:3px 9px 3px 5px;font:600 11.5px var(--f-b);color:var(--fg);white-space:nowrap;box-shadow:0 2px 8px #0007;transform:translate(-50%,calc(-100% - 22px));width:max-content;animation:tin .18s cubic-bezier(.2,.8,.2,1)}
.rvn .ic{width:13px;height:13px;color:var(--c);flex:none}
#rvpill{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:2100;display:flex;align-items:center;gap:6px;max-width:calc(100vw - 120px);background:#1b1e22f0;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font:600 12.5px var(--f-b);color:var(--fg);pointer-events:none;opacity:0;transition:opacity .2s}
#rvpill.on{opacity:1}#rvpill .ic{width:13px;height:13px;color:var(--c);flex:none}#rvpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaflet-tooltip.rvbub{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:4px 9px;font:500 12.5px/1.3 var(--f-b);max-width:190px;width:max-content;white-space:normal;box-shadow:0 2px 10px #0006;pointer-events:none}
.leaflet-tooltip.rvbub small{display:block;font-size:10.5px;color:var(--mut)}.leaflet-tooltip.rvbub.dm{border-style:dashed;border-color:var(--mut)}
.leaflet-tooltip-top.rvbub::before{border-top-color:var(--panel)}
.fkl .fkb i.pv{color:var(--fg);opacity:.75}
.chpn{flex-basis:100%;color:var(--mut);font-size:11.5px;margin-top:2px}
/* §CSS-REPLAY-LISTE Liste der gespeicherten Replays (App) */
.rlh{display:grid;gap:4px;justify-items:start;margin-bottom:6px}
.rll{display:grid;border-top:1px solid var(--line)}
.rlr{display:grid!important;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;width:100%;min-height:62px;padding:10px 0!important;margin:0!important;background:none!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;color:var(--fg)!important;text-align:left;font:inherit}
.rlr .d{grid-column:1;font:400 13px var(--f-b);color:var(--mut)}
.rlr .o{grid-column:1;font:500 16px var(--f-b);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlr .du{grid-column:2;grid-row:1;justify-self:end;font:400 13px var(--f-b);color:var(--mut)}
.rlr .w{grid-column:2;grid-row:2;justify-self:end;display:inline-flex;align-items:center}
.rlr .w .sh{width:15px;height:15px}
.rlr .w .wt{font:400 13px var(--f-b);color:var(--mut)}
.rlr.ph .o,.rlr.ph .d{color:var(--mut)}.rlr.ph .o{background:var(--line);border-radius:6px;width:60%;height:14px;margin:4px 0}
.rlr.bad .o{color:var(--mut);font-weight:400}
.rle{color:var(--mut);font-size:15px;line-height:1.45;padding:18px 0}
/* §CSS-KLAR Designkonzept „Klar“ (15.11.): eine Fläche, Linien statt Kästen, eine Aktionsfarbe (--ac, nur Hauptknöpfe/Logo),
   Farbe sonst nur mit Bedeutung (Aufgabe lila, Bonus blau, Ping orange, Fang rot). Abstände 4/8/12/16/24/32, Zeilen ≥ 48 px.
   Überschriften Barlow Condensed in normaler Schreibweise; Großbuchstaben nur im HUD und bei Alarm-Kennzeichen. */
h2{font:700 30px/1.05 var(--f-d);text-transform:none;letter-spacing:.005em}
h3,.gh{font:700 19px/1.15 var(--f-d);letter-spacing:.005em;text-transform:none;color:var(--fg);margin:12px 0 0}
.gh small{font:400 13px var(--f-b);color:var(--mut)}
button{background:var(--ac);color:#fff;border-radius:10px}

input{background:var(--panel2);border-radius:10px;min-height:48px}

.tabs2 button.on,.rvtab button.on{color:var(--fg)!important;box-shadow:inset 0 -2px 0 var(--fg)}

/* Auswahl in einer Leiste: Modus, Dauer, Tempo, Balancing */
.seg{background:none;border:1px solid var(--line);border-radius:10px;padding:0;gap:0;overflow:hidden}
.seg button{border-radius:0;border-left:1px solid var(--line);min-height:40px;color:var(--mut)}.seg button:first-child{border-left:0}.seg button.on{background:var(--fg);color:var(--bg)}
.tiles.t3{gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.tiles.t3 .tile b{font-size:18px;text-transform:none;letter-spacing:.005em}.tiles.t3 .tile span{font-size:12.5px}

.pre button b{font:700 22px/1 var(--f-d);color:var(--fg)}.pre button.on{background:var(--fg);border-color:var(--line)}.pre button.on,.pre button.on b{color:var(--bg)}
/* Listen: Zeilen mit Linien, keine Kästen */

.lrws>.lrw:first-child{border-top:1px solid var(--line)!important}
.lrw>span{flex:1;min-width:0}.lrw>.v{flex:none;color:var(--mut);font:400 15px var(--f-b);white-space:nowrap}.lrw>.ic{width:14px;height:14px;color:var(--mut)}
.lrw .balw{font-size:14px}

.acc .in{background:none;padding:0}

.sw{width:46px;height:28px;background:var(--line)}.sw::after{width:22px;height:22px;background:#9aa0a7}.sw.on{background:var(--fg)}.sw.on::after{left:21px;background:var(--panel)}
.rl{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}

.chip{border-radius:999px}
/* Lobby-Kopf und Spieler */
.lhd{display:grid;gap:4px;padding-top:4px}.lhd small{font:500 13px var(--f-b);color:var(--mut)}.lhd h2{font-size:32px}

button.lib{width:36px!important;height:36px;border-radius:10px!important;background:none!important}
.lcols{gap:24px}

.lp svg.sh{width:13px;height:13px;flex:none}.lp .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lp.me .nm{font-weight:700}
.lp .r{flex:none;font:500 12.5px var(--f-b);color:var(--mut)}.lp .r.w{color:var(--xping)}.lp .ic{width:14px;height:14px;color:var(--mut);flex:none}.lp .spin{width:14px;height:14px}
button.lsw{background:none!important;border:0!important;color:var(--mut)!important;min-height:36px!important;font:500 14px var(--f-b)!important;border-radius:0!important;margin:4px 0 0!important;padding:0!important;text-decoration:underline;text-underline-offset:3px;justify-content:flex-start;width:auto!important}
.lall .lallg{gap:0 24px}.lrnd,.lrh .fl{background:none;border:0;border-radius:0;padding:10px 0!important;border-bottom:1px solid var(--line)}
.lnote{text-align:left;font-size:13px}
.zhint{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}.zhint button{width:auto!important;min-height:0!important;padding:0!important;margin:0!important;background:none!important;border:0!important;color:var(--fg)!important;text-decoration:underline;text-underline-offset:3px;font:500 13px var(--f-b)!important}
/* Start */
.logo2{display:flex;align-items:center;gap:16px;margin-top:4px}.logo2 svg{width:56px;height:56px;flex:none}
.logo{font:700 46px/.9 var(--f-d)}
.slb{font:500 13px var(--f-b);color:var(--mut);margin:12px 0 -6px}
.sjn{display:grid;grid-template-columns:1fr auto;gap:8px}.sjn input{margin:0;text-transform:uppercase;text-align:center;letter-spacing:.3em}.sjn button{width:auto!important;margin:0;padding:0 18px;background:none;border:1px solid var(--line);color:var(--fg)}

.sw{width:42px;height:26px}.sw::after{width:20px;height:20px}.sw.on::after{left:19px}

.seg,.pre,.tiles.t3{padding:3px;gap:3px;background:var(--bg)}

#fa,#fz{background:var(--panel)}

// Einheitliche Form: game, players (id,name,role,col), tracks, log [[t,pfad,wert]]. Analyse-Dateien und ältere Replays werden umgewandelt.
function rvConv(o){
  if(o&&o.format==='blown-cover-replay'&&o.log)return o;
  if(o&&o.format==='blown-cover-replay'){const log=[];   // v1 ohne Protokoll
    (o.players||[]).forEach(p=>{if(p.state&&p.state!=='alive'&&p.sT){log.push([p.sT,'players/'+p.id+'/sT',p.sT]);log.push([p.sT,'players/'+p.id+'/state',p.state])}});
    (o.catches||[]).forEach(c=>{if(c.hunter)log.push([c.t,'catches/'+c.hider+'/hunter',c.hunter])});
    (o.tasks||[]).forEach(k=>{const p='tasks/'+k.id+'/',t0=k.t0||o.game.startAt;log.push([t0,p+'t0',k.t0]);if(k.loc)log.push([t0,p+'loc/lat',k.loc.lat],[t0,p+'loc/lng',k.loc.lng]);if(k.fin)log.push([k.fin,p+'fin',k.fin])});
    log.sort((a,b)=>a[0]-b[0]);return Object.assign({},o,{log})}
  if(!o||o.format!=='blown-cover-analyse')throw 0;
  const s=o.game.settings,tl=o.timeline||[];let startAt=o.game.startAt,end=null,win=o.game.winner;
  tl.forEach(x=>{if(x[3]==='g'&&x[4][0]==='startAt'&&x[4][2])startAt=x[4][2]});
  tl.forEach(x=>{if(x[3]!=='g'||x[0]<startAt)return;if(x[4][0]==='status'&&x[4][2]==='over'&&!end)end=x[0];if(x[4][0]==='winner'&&x[4][2]&&!win)win=x[4][2]});
  const R0=startAt+s.head*6e4;end=end||R0+s.dur*6e4;const log=[];
  tl.forEach(x=>{if(x[3]!=='g'||x[0]<startAt-5000||x[0]>end+5000)return;const[p,,v]=x[4];
    if(v&&typeof v==='object'){const f=rpFlat(v,p,{});for(const q in f)if(RPP.test(q))log.push([x[0],q,f[q]])}else if(RPP.test(p))log.push([x[0],p,v])});
  const TM={};(o.game.teams||[]).forEach(x=>TM[x.n]={name:x.name,col:Math.max(0,PALN.indexOf(x.color))});
  const players=o.players.map(p=>({id:p.id,name:p.name,role:p.role,col:p.team&&TM[p.team]?TM[p.team].col:Math.max(0,PALN.indexOf(p.color)),tm:p.team||null,tmn:p.teamName||null,lf:p.left,zt:p.zt||null,zb:p.zb||null}));
  const tracks={};Object.entries(o.tracks||{}).forEach(([k,a])=>tracks[k]=a.filter(x=>x[1]!=null).map(x=>[x[0],x[1],x[2],x[3]]));
  return{format:'blown-cover-replay',v:2,code:o.code,round:o.round,game:{s,c:o.game.center,teams:o.game.teams?TM:null,startAt,R0,end,winner:win},players,tracks,log,funk:rvAnFunk(o,players,startAt,end)}}
// Funk aus einer Analyse-Datei (chat = [kanal aus Sicht des Geräts, absender-name, rolle, text, t], von = Geräte, die es sahen; mk+/mk-):
// Privat „dm:X“ → Paar aus Absender, X und den sehenden Geräten; Kanal „all“ (Lobby) bleibt weg
function rvAnFunk(o,players,t0,t1){const byN={},side=p=>p.tm?'t'+p.tm:p.role,ch=[],mk=[];players.forEach(p=>{if(!byN[p.name])byN[p.name]=p});const ids=new Set(players.map(p=>p.id));
  (o.timeline||[]).forEach(x=>{const k=x[3],d=x[4];if(x[0]<t0-5000||x[0]>t1+5000)return;
    if(k==='chat'&&Array.isArray(d)){const u=byN[d[1]];if(!u||d[0]==='all'||typeof d[3]!=='string')return;const t=d[4]||x[0];let c=d[0];
      if(String(c).startsWith('dm:')){const pr=[...new Set([u.id,c.slice(3)].concat(String(x[2]).split(',')))].filter(q=>ids.has(q));const o2=pr.find(q=>q!==u.id);if(!o2)return;c='d:'+side(u)+':'+[u.id,o2].sort().join('_')}
      ch.push([t,u.id,c,d[3].slice(0,200)])}
    else if(k==='mk+'&&Array.isArray(d)&&ids.has(d[1])&&Number.isFinite(d[3]))mk.push([x[0],'+',d[0],d[2],+(+d[3]).toFixed(5),+(+d[4]).toFixed(5),d[5]||null,d[6]?String(d[6]).slice(0,40):null,d[1],null]);
    else if(k==='mk-'&&typeof d==='string')mk.push([x[0],'-',d])});
  ch.sort((a,b)=>a[0]-b[0]);const m=mkMerge(mk);return ch.length||m.length?{ch,mk:m}:null}
// Marker-Ereignisse mehrerer Geräte zusammenführen: dasselbe Ereignis (ID + Art, bei „+“ auch Ort) binnen 10 s nur einmal.
// Marker-IDs werden wiederverwendet (uid_0 …), darum nicht nur nach ID entdoppeln.
function mkMerge(a){const o=[],last={};a.slice().sort((p,q)=>p[0]-q[0]).forEach(x=>{const k=x[2]+x[1]+(x[1]==='+'?x[4]+','+x[5]:''),l=last[k];if(l!=null&&x[0]-l<10000)return;last[k]=x[0];o.push(x)});return o}
const rvD=(a,b)=>{const la=(a[0]+b[0])/2*Math.PI/180;return Math.hypot((b[0]-a[0])*111195,(b[1]-a[1])*111195*Math.cos(la))};

let tmBusy=0;
const bty=g=>!!(g&&g.s&&g.s.mode==='bounty');
const tmN=g=>Math.max(2,Math.min(4,(g&&g.s&&g.s.tN)||2));
const tmOf=k=>{const p=P()[k];return p&&p.role==='hunter'&&G&&bty(G)&&p.tm>=1&&p.tm<=tmN(G)?p.tm:0};
const tmMem=n=>Object.entries(P()).filter(([k,p])=>!p.lf&&p.role==='hunter'&&p.tm===n).sort((a,b)=>(a[1].tj||0)-(b[1].tj||0)||(a[1].j||0)-(b[1].j||0)||(a[0]<b[0]?-1:1));
const tmChef=n=>{const m=tmMem(n);return m.length?m[0][0]:null};
const tmName=(g,n)=>{const x=((g&&g.teams)||{})[n];return (x&&typeof x.name==='string'&&x.name.trim())||'Agentur '+n};
function tmCols(g,teams){const o={},used=new Set(),T=teams||(g&&g.teams)||{},N=tmN(g);
  for(let n=1;n<=N;n++){const c=(T[n]||{}).col;if(Number.isInteger(c)&&c>=0&&c<12&&!used.has(c)){o[n]=c;used.add(c)}}

        return `<div><b class="${o?'x':''} ${on?'o':''}" style="background:${x}" ${o||on?'':`onclick="tmColPick(${n},${i})"`} role=button aria-label="${PALN[i]}${o?' (anderes Team)':''}"></b><span>${o?'Team':PALN[i]}</span></div>`}).join('')}</div></div>`:'')

function tmCheck(){const g=G,m=P()[uid];if(!g||g.status!=='lobby'||!bty(g)||!m||m.w||rndOn(g))return;
  if(m.role==='hunter'&&!(m.tm>=1&&m.tm<=tmN(g))&&!tmBusy){tmBusy=1;const c=[];for(let n=1;n<=tmN(g);n++)c.push([tmMem(n).length,n]);c.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);tmJoin(c[0][1]).finally(()=>{tmBusy=0})}

// Wertung: Fänge je Team (zählt für das Team des meldenden Hunters), Gleichstand → früherer letzter Fang gewinnt
function tmRank(g){const pl=g.players||{},ct=g.catches||{},R0=rs(g),tc=tmCols(g),N=tmN(g),o=[];

// Ping-Takt. Grundspiel: fest alle s.ping. Zombie: nach jedem Ping neu p = p0·√((H/X)/(H0/X0)), 30 s … 3·p0, auf 10 s gerundet;
// H/X aus der Besetzung zum Zeitpunkt des letzten Pings (Verwandlungszeit zt, Ausscheiden sT) – jeder Client rechnet gleich
function zIv(g,pl,T){const p0=(g.s.ping||60)*1000;if(!zmb(g)||!zPg(g))return p0;let H0=0,X0=0,H=0,X=0;
  Object.values(pl||{}).forEach(p=>{if(!p||!p.role||p.w)return;if(p.zt){X0++;if(p.zt<=T)H++;else X++}else if(p.role==='hunter'){H0++;H++}else if(p.role==='hider'){X0++;if(!(p.state!=='alive'&&p.sT&&p.sT<=T))X++}});
  if(!H0||!X0||!X)return p0;return Math.max(30000,Math.min(zCap(g)*p0,Math.round(p0*Math.sqrt((H/X)/(H0/X0))/1e4)*1e4))}
function pgK(g,t,pl){const R0=rs(g),p0=(g.s.ping||60)*1000;if(t<R0)return{k:0,at:0,next:R0+p0,iv:p0};
  if(!zmb(g)){const k=Math.floor((t-R0)/p0);return{k,at:k>=1?R0+k*p0:0,next:R0+(k+1)*p0,iv:p0}}
  pl=pl||P();let T=R0,k=0,iv=zIv(g,pl,R0);for(let i=0;i<2000&&T+iv<=t;i++){T+=iv;k++;iv=zIv(g,pl,T)}return{k,at:k>=1?T:0,next:T+iv,iv}}
const lastPT=()=>pgK(G,now()).at;
const mkB=()=>G&&bty(G)&&tmOf(uid)?'tmarks/'+code+'/'+tmOf(uid):'marks/'+code;

    mkL.on('value',sn=>{const v=sn.val()||{};rpMk(v);if(AL.on){const pv=mkSeen||{};Object.keys(v).forEach(id=>{if(!pv[id])lg('mk+',[id,v[id].u,v[id].k,v[id].lat,v[id].lng,v[id].r||null,v[id].x||null])});Object.keys(pv).forEach(id=>{if(!v[id])lg('mk-',id)})}if(mkSeen)Object.entries(v).forEach(([id,x])=>{if(!mkSeen[id]&&x.u!==uid&&now()-x.t<15000&&MKT[x.k]){const q=P()[x.u];note((q?q.name:'Hunter')+' '+MKT[x.k])}});mkSeen=v;MK=v;draw();mkUI()},()=>{})}

function fsWait(g,h,t){const m=fsMine(),w=Math.max(10,g.s.hbC||60)*1000;let e=m.l?m.l+w:0;if(h&&m.p[h])e=Math.max(e,m.p[h]+2*w);return e>t?e:0}

// Hider: Auslösung prüfen, Alarm, „Ich bleibe stehen“, Ablauf

  if(f&&f.t>=(g.startAt||0)&&(!FSH||FSH.k!==f.h+'_'+f.t)&&t<f.t+fsTv(g)){const hq=P()[f.h]||{},fresh=!!pos&&(TEST||Date.now()-lastFix<30000),hf=!!hq.lat&&(TEST||t-(hq.ts||0)<30000);
    const d=fresh&&hf?Math.round(D(pos,hq)):null,why=m.state!=='alive'?'frei? nein':hq.role!=='hunter'||hq.state!=='alive'?'hunter':!fresh?'eigenes GPS':!hf?'GPS Hunter':d>fsRv(g)?'zu weit':hkAct(g,uid)?'hackt':null;
    FSH={k:f.h+'_'+f.t,h:f.h,t0:f.t,ok:!why,a:0,done:0};fsSave();lg('fsh',{h:f.h,d,ok:!why,why});
    db.ref(`fzp/${code}/${uid}`).set({t:f.t,ok:!why}).catch(()=>{});lastSig=''}

    if(H.ok&&H.a&&m.state==='alive'&&m.role==='hider'){const iu=end+Math.round((g.s.imm||120)*500),ps=pgK(g,iu).next;
      FSX={h:H.h,until:iu};db.ref(`games/${code}/players/${uid}`).update({immUntil:Math.max(iu,m.immUntil||0),pS:ps}).catch(()=>{});
      toast('Entkommen! Du bist '+fmt(iu-t)+' geschützt und siehst '+((P()[H.h]||{}).name||'den Hunter')+' live.');lg('fsx',{h:H.h,iu,ps})}
    else lg('fse',{ok:H.ok,a:!!H.a,st:m.state});
    fsSave();lastSig=''}

function fsStand(){if(!FSH||FSH.a)return;FSH.a=now();fsSave();db.ref(`fzp/${code}/${uid}/a`).set(FSH.a).catch(()=>{});lg('fsa',{dt:FSH.a-FSH.t0});fsAlarm(0);fsOv(null);lastSig='';panel(1)}
function fsOv(H,end,t){let e=$('fz');if(!H){if(e)e.remove();return}
  const q=P()[H.h]||{},rem=Math.max(0,Math.ceil((end-t)/1000)),T=fsTv(G)/1000;

    e.innerHTML=`<div class=fb><div class=fe>FESTGESETZT</div><div class=fr><div></div></div><div class=ft>Enttarnt!<br>Bleib stehen</div><div class=who><span class=av style="background:${colOf(H.h)};color:${inkOf(H.h)}">${esc(String(q.name||'?')[0].toUpperCase())}</span><b>${esc(q.name||'Ein '+HN(G))} hat dich im Visier</b></div><button class=fy onclick="fsStand()">Ich bleibe stehen</button></div>`;document.body.appendChild(e)}

// Alarm: Vibration (Android) bzw. Ton (iPhone), jede Sekunde neu bis „Ich bleibe stehen“
function fsAudio(){try{if(!fsAud){const C=window.AudioContext||window.webkitAudioContext;if(C)fsAud=new C()}if(fsAud&&fsAud.state==='suspended')fsAud.resume()}catch(e){}}

function fsAlarm(on){if(!on){if(fsAK){fsAK=0;try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}return}
  const n=Date.now();if(n-fsAK<950)return;const first=!fsAK;fsAK=n;
  if(first&&(document.hidden||window.bcHidden))toast('Festgesetzt! Bleib stehen');
  let v=false;try{v=!!(navigator.vibrate&&navigator.vibrate([600,400]))}catch(e){}
  if(!v){fsAudio();try{if(fsAud){const o=fsAud.createOscillator(),gn=fsAud.createGain(),c=fsAud.currentTime;o.type='square';o.frequency.value=880;gn.gain.setValueAtTime(.0001,c);gn.gain.exponentialRampToValueAtTime(.25,c+.02);gn.gain.setValueAtTime(.25,c+.25);gn.gain.exponentialRampToValueAtTime(.0001,c+.45);o.connect(gn).connect(fsAud.destination);o.start(c);o.stop(c+.5)}}catch(e){}}}

const cpCode=()=>{const l=LINK(code);try{navigator.clipboard.writeText(l).then(()=>toast('Einladungslink kopiert')).catch(()=>toast(l))}catch(e){toast(l)}};

const nfl=(k,l,u)=>nf(k).replace(/<label>[^<]*<\/label>/,`<label>${l}${u?`<small>${u}</small>`:''}</label>`);

  if(e&&e.contains(document.activeElement)&&document.activeElement.tagName==='INPUT')return;

function pgZone(g){const s=g.s,z=zoneSeq(s),n=z.length-1,end=(s.head||0)+n*s.shrink,walk=Math.round(2*s.r0/80),cx=180,cy=100,R=90,sc=R/s.r0,rm=s.rMin*sc;
  let rings='';const every=Math.max(1,Math.ceil(n/6));for(let i=every;i<n;i+=every)rings+=`<circle cx="${cx}" cy="${cy}" r="${(z[i]*sc).toFixed(1)}" fill="none" stroke="#e5484d" stroke-opacity=".25"/>`;

    <circle cx="${cx}" cy="${cy}" r="${rm.toFixed(1)}" fill="#e5484d" fill-opacity=".1" stroke="#e4e2dd" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="${cx}" y1="${cy}" x2="${cx+R}" y2="${cy}" stroke="#e4e2dd" stroke-opacity=".45"/><circle cx="${cx}" cy="${cy}" r="3" fill="#e4e2dd"/>
    <text x="${cx+R+6}" y="${cy-5}" class=t1>${s.r0} m</text><text x="${cx+R+6}" y="${cy+12}" class=t2>Start</text><text x="${cx-rm-8}" y="${cy+4}" text-anchor="end" class=t1>${s.rMin} m</text><text x="${cx-rm-8}" y="${cy+20}" text-anchor="end" class=t2>Ende</text></svg>`;

    +`<div class=mz2>${big('r0','Startradius')}${big('rMin','Mindestradius')}</div>`
    +card('Schrumpfen',`<p class=mzs>Die Zone wird alle ${chp('shrink')} um ${chp('step')} kleiner.</p>`+pop('shrink',`${n} Schritte bis ${s.rMin} m`)+pop('step',`${n} Schritte bis ${s.rMin} m`))
    +card('Zone verlassen',`<p class=mzs>Wer draußen ist, wird live gezeigt. ${(s.ot||0)>0?`Nach ${chp('ot')} scheidet er aus`:`Ausscheiden: ${chp('ot','nie')}`}, nach der Rückkehr bleibt er ${chp('pen')} sichtbar.</p>`+pop('ot','Höchstens draußen · 0 = nie')+pop('pen','Sichtbar nach der Rückkehr'))
    +`<div class=zhint>Zonenmitte: roten Punkt auf der Karte ziehen · <button onclick="ctr()">Auf mich</button></div>`}

function pgZeit(g){const s=g.s,T=s.dur||60,h=s.head||0,p=(s.ping||60)/60,X=m=>10+340*(m+h)/(T+h);let pg=[];for(let t=p;t<=T+1e-6&&pg.length<400;t+=p)pg.push(t);
  // Headstart liegt vor der Spielzeit (Minute −h bis 0), Pings ab Minute 0 alle p Minuten; Striche alle 5 Min, Zahlen alle 15 Min
  let tk='';const T_=(m,l)=>`<line x1="${X(m).toFixed(1)}" y1="44" x2="${X(m).toFixed(1)}" y2="${l?51:48}" stroke="${l?'#5c6168':'#363b42'}"/>`;

function inStep(i,d){IN.i=i;IN.a=0;IN.gen++;IN.L.clearLayers();IN.mk={};IN.z=IN.nz=null;IN.h={};inBox();$('toast').innerHTML='';INP.a[1]=0;INP.b[1]=8;

function inCard(d){const s=INS[IN.i],v=inV(),n=INS.length,a=s.act?s.act(v):[],c=typeof s.c==='function'?s.c(v):s.c,last=IN.i===n-1;

// §UPDATE App-Version prüfen (GitHub Releases): in der App bei älterer Version Dialog beim Öffnen + Kartenknopf `#upb` mit orangem Punkt,
// nur auf dem Startbildschirm (nie in Lobby/Spiel); Android-Browser: derselbe Knopf ohne Punkt. Neueste Version höchstens alle 3 h abfragen.
const APK='https://github.com/nelodersack/blown-cover/releases/latest/download/BlownCover.apk',REL='https://api.github.com/repos/nelodersack/blown-cover/releases/latest';
const appVer=()=>{try{return NB&&NB.info?String(JSON.parse(NB.info()).ver||''):''}catch(e){return''}};
const verLt=(a,b)=>{const x=String(a).replace(/^v/,'').split('.').map(n=>parseInt(n)||0),y=String(b).replace(/^v/,'').split('.').map(n=>parseInt(n)||0);for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0))return(x[i]||0)<(y[i]||0)}return false};
const updNew=()=>{const a=appVer();return !!(UPD&&a&&verLt(a,UPD))};
// sichtbar nur auf dem Startbildschirm: App → nur bei Update (mit Punkt); Android-Browser → immer, sobald ein Release da ist
function updSync(){const b=$('upb');if(!b)return;const n=!!NB&&updNew(),on=!G&&!RV&&!!UPD&&(NB?n:/Android/i.test(navigator.userAgent));
  b.style.display=on?'grid':'none';b.classList.toggle('new',n);b.setAttribute('aria-label',n?'App-Update laden (v'+UPD+')':'Blown Cover als Android-App öffnen oder laden')}
// App ab Bridge update(url): lädt und installiert selbst (kein externer Browser); sonst Download im Browser
const updIn=()=>{try{return !!NB&&typeof NB.update==='function'}catch(e){return false}};
// Android-Browser: Intent-Link – App installiert → App öffnet sich, sonst lädt der Browser die APK (browser_fallback_url)
const updIntent=()=>'intent://blowncover.app/#Intent;scheme=https;package=at.blowncover.app;S.browser_fallback_url='+encodeURIComponent(APK)+';end';
function updGo(){if(!NB&&/Android/i.test(navigator.userAgent)){location.href=updIntent();return}try{if(updIn()){NB.update(APK);toast('Update wird geladen…');return}}catch(e){}location.href=APK}
async function updCheck(){let c=null;try{c=JSON.parse(LS.updC||'null')}catch(e){}
  // Zwischenspeicher nur, solange er etwas Neueres als die installierte App kennt (sonst würde ein frisches Release bis zu 3 h übersehen)
  const av=appVer();if(c&&c.v&&Date.now()-c.t<3*36e5&&!(av&&!verLt(av,c.v)))UPD=c.v;
  else try{const r=await fetch(REL,{headers:{Accept:'application/vnd.github+json'}});if(r.ok){const j=await r.json(),v=String(j.tag_name||'').replace(/^v/,'');if(/^\d+(\.\d+)*$/.test(v)&&(j.assets||[]).some(a=>a.name==='BlownCover.apk')){UPD=v;LS.updC=JSON.stringify({v,t:Date.now()})}}}catch(e){}
  updSync();
  if(updNew()&&!updAsked&&!G&&!LS.c){updAsked=true;if(await dlg({t:'Update verfügbar',x:`Version ${esc(UPD)} der App ist da (installiert: ${esc(appVer())}). ${updIn()?'Bitte installiere die neue Version.':'Der Download öffnet sich im Browser, danach installierst du das Update wie gewohnt. Deine Einstellungen bleiben erhalten.'}`,ok:'Jetzt laden',no:'Später'}))updGo()}}

(TEST?firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION):Promise.resolve()).then(()=>firebase.auth().signInAnonymously()).then(u=>{uid=u.user.uid;
