// GPS
function startGPS(){if(startGPS.on)return;startGPS.on=1;
  if(TEST){const put=(la,ln)=>{pos={lat:la,lng:ln};lastFix=Date.now();write(1)};
    navigator.geolocation.getCurrentPosition(q=>put(q.coords.latitude,q.coords.longitude),()=>{const c=map.getCenter();put(c.lat,c.lng)},{timeout:4000});
    setInterval(()=>{if(pos)lastFix=Date.now()},5000);return}
  navigator.geolocation.watchPosition(p=>{const pg=lastFix?Date.now()-lastFix:0;pos={lat:p.coords.latitude,lng:p.coords.longitude};lastFix=Date.now();
    if(G&&G.status==='running'&&pg>gwv(G)*1000){const mm=P()[uid];if(mm&&mm.state==='alive'&&now()>=G.startAt)evW(uid+'_r_'+Date.now(),lbl(mm)+' ist wieder verbunden')}
    const g=$('gs');if(g)g.textContent='GPS bereit ✓';if(!G&&!fitted)map.setView([pos.lat,pos.lng],16);write()},
    e=>toast('GPS: '+e.message),{enableHighAccuracy:true,maximumAge:0,timeout:20000})}

  db.ref(`games/${code}/players/${uid}`).update({lat:pos.lat,lng:pos.lng,ts:now()})}

  if(!pos){const b=$('mkb');b.textContent='GPS wird gesucht…';b.disabled=true;
    for(let i=0;i<100&&!pos;i++)await new Promise(r=>setTimeout(r,200));
    if(!pos){b.textContent='Neues Spiel erstellen';b.disabled=false;return toast('Kein GPS – bitte Standortfreigabe prüfen')}}
  const c=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
  await db.ref('games/'+c).set({host:uid,status:'lobby',c:pos,s:{r0:500,rMin:200,shrink:5,head:2,dur:30,ping:60,pen:2,mode:'survive',taskR:0,imm:120,shOn:true,shT:10,evT:5,ddN:1,ddT:5,mtN:0,mtT:5,bon:true,hbOn:true,hbN:2,hbC:60,hbL:60,hbT:10,gw:20,gd:60}});join(c)}

async function join(c){const s=await db.ref('games/'+c).get();
  if(!s.exists()){LS.removeItem('c');return toast('Code unbekannt')}
  const g=s.val(),had=g.players&&g.players[uid];
  if(g.status!=='lobby'&&!had)return toast('Spiel läuft bereits');
  if(had&&had.lf){LS.removeItem('c');return toast('Du hast dieses Spiel verlassen')}
  code=c;LS.c=c;
  if(!had)await db.ref(`games/${c}/players/${uid}`).set({name:me.name||'Agent',role:'hider',state:'alive',j:now()});
  evSince=now()-1000;db.ref(`games/${c}/ev`).limitToLast(20).on('child_added',sn=>{const e=sn.val();if(e&&e.t>=evSince&&e.u!==uid&&typeof e.x==='string')note(e.x)});
  db.ref('games/'+c).on('value',s=>{if(!s.exists()){LS.removeItem('c');location.reload();return}G=s.val();onData()})}

async function leaveGame(){const g=G,m=P()[uid]||{};
  if(g.status==='running'&&m.state==='alive'&&!confirm('Das Spiel läuft noch. Wirklich verlassen?'))return;
  const others=Object.entries(P()).filter(([k,p])=>k!==uid&&!p.lf).sort(byJ),u={};
  try{
    if(g.host===uid&&!others.length){try{await db.ref('chats/'+code).remove()}catch(e){}await db.ref('games/'+code).remove();return leave()}
    if(g.host===uid)u.host=others[0][0];
    if(g.status==='lobby')u['players/'+uid]=null;
    else{u['players/'+uid+'/lf']=true;const k=uid+'_l';evSeen.add(k);u['ev/'+k]={t:now(),x:lbl(m)+' hat das Spiel verlassen',u:uid}}
    await db.ref('games/'+code).update(u)}
  catch(e){toast('Verlassen nicht möglich: '+String(e.message||e).slice(0,50));return}
  leave()}
function newRound(){const g=G;if(!g||g.status!=='over')return;
  const u={status:'lobby',startAt:null,winner:null,tasks:null,catches:null,hb:null,live:null,xp:null,ev:null,rn:(g.rn||0)+1,prev:{j:JSON.stringify(buildRes(g))}};
  Object.entries(P()).forEach(([k,p])=>{u['players/'+k]=p.lf?null:{name:p.name,role:p.role,state:'alive',j:p.j||0}});
  const ho=P()[g.host];if(!ho||ho.lf){const c=Object.entries(P()).filter(([k,p])=>!p.lf).sort(byJ)[0];if(c)u.host=c[0]}
  db.ref('games/'+code).update(u).then(()=>db.ref('chats/'+code).remove()).catch(()=>{})}
async function st(){const v=Object.values(P());
  if(!v.some(p=>p.role==='hunter')||!v.some(p=>p.role==='hider'))return toast('Mindestens 1 Hunter und 1 Hider nötig');
  const g=G,s=g.s,b=$('stb'),base=md(g)==='mission'?['ev']:(s.shOn?['sh']:[]);
  const hs=Object.entries(P()).filter(([k,p])=>p.role==='hider'&&p.state==='alive').map(e=>e[0]);
  for(let i=hs.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[hs[i],hs[j]]=[hs[j],hs[i]]}
  const nd=Math.min(s.ddN||0,Math.floor(hs.length/2)),nm=Math.min(s.mtN||0,Math.floor((hs.length-2*nd)/2)),notes=[];
  if((s.ddN||0)>nd||(s.mtN||0)>nm)notes.push('Zu wenige Hider: nur '+nd+' Dead Drop(s) und '+nm+' Meeting(s)');
  else if(nd+nm>0&&2*(nd+nm)>=hs.length)notes.push('Hinweis: kein Reserve-Hider für Ersatz');
  const dd=Array.from({length:nd},(_,i)=>'d'+(i+1)),need=base.concat(dd);
  if(b){b.disabled=true;b.textContent='Orte werden gesucht…'}
  try{let r=null;if(need.length||nm)r=await mkPts(g.c,Math.max(40,taskRad(s)-15),4*need.length+nm);
    const startAt=now()+5000,R0=startAt+s.head*6e4,tasks={};
    need.forEach((id,i)=>{const a=r.pts.slice(i*4,i*4+4),d=isDd(id);
      tasks[id]={t0:id==='ev'?R0+Math.max(0,s.dur-s.evT)*6e4:R0+Math.min(d?(s.ddT||0):s.shT,s.dur-1)*6e4,loc:a[0],alt:a.slice(1),rr:0};
      if(d){const n=+id.slice(1)-1;tasks[id].a=hs[2*n];tasks[id].b=hs[2*n+1]}});
    for(let j=0;j<nm;j++)tasks['m'+(j+1)]={t0:R0+Math.min(s.mtT||0,s.dur-1)*6e4,loc:r.pts[4*need.length+j],rr:0,a:hs[2*nd+2*j],b:hs[2*nd+2*j+1]};
    if(r&&r.fb)notes.unshift(r.net?'Kartendienst nicht erreichbar ('+(r.err||'?')+'): Zufallsorte':'Nur '+r.real+' von '+r.n+' Orten aus Kartendaten, Rest zufällig');
    if(notes.length)toast(notes.join(' · '));
    const u={status:'running',startAt};if(Object.keys(tasks).length)u.tasks=tasks;
    await db.ref('games/'+code).update(u)}
  catch(e){toast('Start fehlgeschlagen: '+String(e.message||e).slice(0,60));if(b){b.disabled=false;b.textContent='Spiel starten'}}}

  cand=Object.entries(P()).filter(([k,p])=>p.role==='hider'&&p.state==='alive').sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name)));

  db.ref(`games/${code}/catches/${h}`).set(c);toast('Anfrage gesendet');panel(1)}
function ok(){const c=G.catches&&G.catches[uid];if(!c||c.status!=='pending')return;const hq=P()[c.hunter];
  if(!hq||hq.state!=='alive')return db.ref(`games/${code}/catches/${uid}`).remove().catch(()=>{});
  const why=catchWhy(hq,now());

  db.ref(`games/${code}`).update({[`players/${uid}/state`]:'caught',[`players/${uid}/sT`]:now(),[`catches/${uid}/status`]:'done'})}

const hbRef=id=>db.ref(`games/${code}/hb/${uid}/${id}`);
function hbChoose(id,k,base){const g=G;if(hbItems(g).length>=(g.s.hbN||2)){hbPick={id,k,base};return panel(1)}hbCommit(id,k,base,null)}
function hbCommit(id,k,base,drop){const g=G,av=base+(g.s.hbC||0)*1000,u={[id]:{k,av}};if(drop)u[drop+'/d']=now();
  db.ref(`games/${code}/hb/${uid}`).update(u).then(()=>{hbPick=null;toast('Bonus erhalten: '+HBK[k]);panel(1)}).catch(()=>toast('Das hat nicht geklappt'))}
function hbSwap(drop){if(hbPick)hbCommit(hbPick.id,hbPick.k,hbPick.base,drop)}
function hbForfeit(id){hbRef(id).set({k:'x'}).then(()=>{hbPick=null;toast('Bonus verfallen gelassen');panel(1)})}
function hbUse(id){const i=hbMine(G)[id];if(!i||i.u||i.d||now()<i.av)return;
  if(i.k==='live'){hbLive=id;return panel(1)}
  const t=now(),pts={},grey={},nm=[];
  Object.entries(P()).forEach(([u,p])=>{if(p.role!=='hider'||p.state!=='alive')return;
    if(locatable(p,t)){pts[u]={lat:p.lat,lng:p.lng,name:p.name};lk[u]=pts[u]}else{nm.push(p.name);if(lk[u])grey[u]=lk[u]}});
  hbRef(id+'/u').set(t).then(()=>{xping={t,pts,grey};db.ref(`games/${code}/xp`).push({t});
    toast(nm.length?'Extra-Ping! Nicht ortbar: '+nm.join(', '):'Extra-Ping!');navigator.vibrate&&navigator.vibrate(300);draw();panel(1)})}
function hbLiveGo(h){const g=G,t=now(),id=hbLive,i=id&&hbMine(g)[id];if(!i||i.u||i.d)return;
  if(t<hbLock)return toast('Bitte kurz warten ('+Math.ceil((hbLock-t)/1000)+' s)');
  if(!locatable(P()[h],t)){hbLock=t+10000;return toast('Gerade nicht möglich: Dieser Hider ist nicht ortbar. Dein Bonus bleibt erhalten.')}
  const until=t+(g.s.hbL||60)*1000;
  hbRef(id+'/u').set(t).then(()=>{db.ref(`games/${code}/live/${h}/${uid}`).set(until);hbLive=null;toast('Live-Ortung läuft');draw();panel(1)})}
function hbPanel(g,t){const tk=hbTokens(g,t),it=hbItems(g),N=g.s.hbN||2,full=it.length>=N;let h=`<small>Boni (${it.length}/${N})</small>`;
  if(hbPick)h+=`<div class=tk><b>Vorrat voll</b><br><small>Welchen Bonus ersetzt du durch ${HBK[hbPick.k]}?</small><br>`+it.map(([id,i])=>`<button class="s" onclick="hbSwap('${id}')">${HBK[i.k]}</button>`).join(' ')+` <button class="s g" onclick="hbPick=null;panel(1)">Abbrechen</button></div>`;
  else tk.forEach(x=>{h+=`<div class=tk><b>Neuer Bonus</b> <small>(${x.lbl})</small>${full?'<br><small>Dein Vorrat ist voll: Wähle einen Bonus und tausche ihn gegen einen vorhandenen, oder lass ihn verfallen.</small>':''}<br><button class="s" onclick="hbChoose('${x.id}','live',${x.base})">Live-Standort</button> <button class="s" onclick="hbChoose('${x.id}','ping',${x.base})">Extra-Ping</button>${full?` <button class="s g" onclick="hbForfeit('${x.id}')">Verfallen lassen</button>`:''}</div>`});
  if(hbLive){const hs=Object.entries(P()).filter(([k,p])=>p.role==='hider'&&p.state==='alive').sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name)));
    h+=`<div class=tk><b>Live-Standort</b> <small>(${g.s.hbL||60} s)</small><br><small>Wessen Standort willst du live sehen?</small>`+hs.map(([k,p])=>`<button style="width:100%" onclick="hbLiveGo('${k}')">${esc(p.name)}</button>`).join('')+`<button class=g style="width:100%" onclick="hbLive=null;panel(1)">Abbrechen</button></div>`}
  else it.forEach(([id,i])=>{const rd=t>=i.av;h+=`<div class=tk><b>${HBK[i.k]}</b>${i.k==='live'?` <small>(${g.s.hbL||60} s)</small>`:''} `+(rd?`<button class="s" onclick="hbUse('${id}')">Einsetzen</button>`:`<small>bereit in ${fmt(i.av-t)}</small>`)+`</div>`});
  if(!tk.length&&!it.length)h+=`<br><small>Noch keine Boni. Nach einem Fang darfst du einen wählen.</small>`;
  return h}
const mtRef=id=>db.ref(`games/${code}/tasks/${id}/p/${uid}`);

function mtChoice(id,c){const k=G.tasks&&G.tasks[id];if(!k||k.fin||k.ex)return;mtRef(id).set({c,ok:false})}
function mtUndo(id){const k=G.tasks&&G.tasks[id];if(!k||k.fin)return;const my=(k.p||{})[uid]||{},o={ok:false};if(my.c)o.c=my.c;mtRef(id).set(o)}
function mtConfirm(id){const k=G.tasks&&G.tasks[id];if(!k||k.fin||k.ex||k.sol)return;const my=(k.p||{})[uid]||{},ot=(k.p||{})[k.a===uid?k.b:k.a]||{},d=mtD(k),bon=bonOn(G);

  const pa=(k.p||{})[k.a],pb=(k.p||{})[k.b];
  if(pa&&pb&&pa.ok&&pb.ok&&(!bonOn(g)||(pa.c&&pb.c&&pa.c!==pb.c)))db.ref(`games/${code}/tasks/${id}/fin`).set(now()).catch(()=>{})})}

function hTasks(g,t){let h='';const T=g.tasks||{},im=g.s.imm||120;

  if(ping)Object.entries(ping.pts).forEach(([id,p])=>{if(P()[id]&&P()[id].state!=='alive')return;dot([p.lat,p.lng],'#f77f00',m.role==='hunter'?esc(p.name)+' (Ping)':'Dein letzter Ping',m.role==='hunter'?9:14)});
  if(ping&&ping.grey)Object.entries(ping.grey).forEach(([id,p])=>{if(P()[id]&&P()[id].state!=='alive')return;dot([p.lat,p.lng],'#888',esc(p.name)+' (nicht ortbar)',9,.55)});
  if(m.role==='hunter'&&!spec){
    if(xping&&t-xping.t<120000){Object.entries(xping.pts).forEach(([id,q])=>{if(P()[id]&&P()[id].state!=='alive')return;dot([q.lat,q.lng],'#ffb703',esc(q.name)+' (Extra-Ping)',9)});
      Object.entries(xping.grey).forEach(([id,q])=>{if(P()[id]&&P()[id].state!=='alive')return;dot([q.lat,q.lng],'#888',esc(q.name)+' (nicht ortbar)',9,.55)})}
    Object.entries(g.live||{}).forEach(([hid,o])=>{const un=o&&o[uid],q=P()[hid];if(!(un>t)||!q||q.state!=='alive')return;
      if(locatable(q,t)){lk[hid]={lat:q.lat,lng:q.lng,name:q.name};dot([q.lat,q.lng],'#ff006e','📍 '+esc(q.name)+' (live)',10)}
      else if(lk[hid])dot([lk[hid].lat,lk[hid].lng],'#888',esc(q.name)+' (nicht ortbar)',9,.55)})}
  if(m.role==='hunter'||spec)Object.entries(g.catches||{}).forEach(([h,c])=>{const q=P()[h];if(c.status==='done'&&c.lat&&q&&q.state==='caught')dot([c.lat,c.lng],'#d6249f','✓ '+esc(q.name)+' gefangen',8)});
  if(m.role==='hider'&&m.state==='alive'&&g.status==='running')['sh','ev'].forEach(id=>{const k=g.tasks&&g.tasks[id];
    if(!k||t<k.t0||(id==='sh'&&(Object.keys(k.in||{}).length>=2||(k.in&&k.in[uid]))))return;
    L.circle([k.loc.lat,k.loc.lng],{radius:40,color:'#7b2cbf',weight:2,fillColor:'#7b2cbf',fillOpacity:.15}).addTo(lay);
    dot([k.loc.lat,k.loc.lng],'#7b2cbf',id==='sh'?'Safehouse':'Evakuierung',7)});
  if(m.role==='hider'&&m.state==='alive'&&g.status==='running')Object.entries(g.tasks||{}).filter(([id])=>isDd(id)||isMt(id)).forEach(([id,k])=>{
    if(t<k.t0||k.fin||k.pick||k.ex)return;
    if(k.sol===uid||(isDd(id)&&!k.sol&&((k.a===uid&&!k.dep)||(k.b===uid&&k.dep)))){
      L.circle([k.loc.lat,k.loc.lng],{radius:40,color:'#7b2cbf',weight:2,fillColor:'#7b2cbf',fillOpacity:.15}).addTo(lay);
      dot([k.loc.lat,k.loc.lng],'#7b2cbf',isMt(id)?'Meeting':'Dead Drop',7)}});
  if(radar&&t-radar.t<60000)radar.pts.forEach(p=>L.circleMarker([p.lat,p.lng],{radius:8,color:'#fff',weight:2,fillColor:'#111',fillOpacity:.9}).bindTooltip('Hunter '+esc(p.name)+' (Radar)',{permanent:true,direction:'top'}).addTo(lay));
  if(pos)dot([pos.lat,pos.lng],'#1e7cf0','',9)}

function onData(){
  if((G.rn||0)!==lastRn){lastRn=G.rn||0;ping=radar=xping=null;lk={};lastK=0;lastTV='';cand=[];hbPick=hbLive=null;wasOut=false;lastLv=0;lastXp=null;ddLock=0;endLock=0;evSeen=new Set();onData.l=0;lastSig=''}
  if(G.status==='running'&&!onData.l){onData.l=1;lock()}
  panel();draw();chatSync()}

// Sekundentakt
setInterval(()=>{if(!G){return}const g=G,t=now(),m=P()[uid]||{};let h='';
  const nw=Date.now();if(nw-lastTick>3000)skipUntil=nw+10000;lastTick=nw;
  if(pos&&nw-lastW>=8000&&nw-lastFix<15000)write(1);
  if(m.role&&t>=hostLock){const ho=P()[g.host];
    if(!ho||ho.lf||(g.status!=='running'&&ho.ts&&t-ho.ts>80000)){
      const c=Object.entries(P()).filter(([k,p])=>!p.lf&&(k===uid||(p.ts&&t-p.ts<30000))).sort(byJ)[0];
      if(c&&c[0]===uid&&g.host!==uid){hostLock=t+5000;db.ref(`games/${code}/host`).set(uid).catch(()=>{})}}}
  if(g.status==='lobby'){$('hud').innerHTML='';return}
  if(g.status==='over'){$('hud').innerHTML='<span>Spiel vorbei</span>';panel();return}
  const R0=rs(g);
  if(!TEST&&m.role&&conn&&nw>connSince+8000&&nw>skipUntil&&t>=g.startAt+15000){
    Object.entries(P()).forEach(([k,p])=>{if(k===uid||p.state!=='alive'||!p.ts)return;const age=t-p.ts;
      if(age>gwv(g)*1000)evW(k+'_w_'+p.ts,lbl(p)+' hat die Verbindung verloren',k);
      if(age>gdv(g)*1000&&!evSeen.has(k+'_d')){db.ref(`games/${code}/players/${k}`).update({state:'dq',sT:now()}).catch(()=>{});evW(k+'_d',lbl(p)+' wurde disqualifiziert (Verbindung verloren)',k)}})}
  if(t<g.startAt)h=`<span>Start in ${fmt(g.startAt-t)}</span>`;
  else if(t<R0)h=m.role==='hunter'?`<span>Hunter starten in ${fmt(R0-t)}</span>`:`<span>Headstart: noch ${fmt(R0-t)}</span>`;
  else{const el=t-R0,nextS=g.s.shrink*6e4-el%(g.s.shrink*6e4),nextP=g.s.ping*1000-el%(g.s.ping*1000);
    h=`<span>⏱ ${fmt(g.s.dur*6e4-el)}</span>`+(Rad(g,t)>g.s.rMin?`<span>${AR}${fmt(nextS)}</span>`:'')+`<span>Ping in ${fmt(nextP)}</span>`}
  // GPS-Verlust (alle Rollen) & Zone (Hider)
  if(m.role&&m.state==='alive'&&t>=g.startAt){
    const gap=Date.now()-lastFix,GW=gwv(g),GD=gdv(g);
    if(gap>GW*1000)h+=`<span class=w>GPS-Signal weg! DQ in ${Math.max(0,GD-Math.floor(gap/1000))} s</span>`;
    if(gap>GD*1000){db.ref(`games/${code}/players/${uid}`).update({state:'dq',sT:now()});evW(uid+'_d',lbl(m)+' wurde disqualifiziert (Verbindung verloren)')}
    if(m.role==='hider'&&pos){const out=D(pos,g.c)>Rad(g,t);
      if(out&&!wasOut){wasOut=true;db.ref(`games/${code}/players/${uid}`).update({out:true,revealUntil:0});write(1)}
      if(!out&&wasOut){wasOut=false;db.ref(`games/${code}/players/${uid}`).update({out:false,revealUntil:t+g.s.pen*6e4})}
      if(out)h+=`<span class=w>Außerhalb der Zone! Dein Standort ist sichtbar</span>`}}
  if(isSpec(m)&&(ping||radar||xping)){ping=radar=xping=null;draw()}
  if(m.role==='hider'&&m.state==='alive'&&(m.immUntil||0)>t)h+=`<span>Schutz ${fmt(m.immUntil-t)}</span>`;
  if(m.role==='hider'&&m.state==='alive'){const vis=myTk(g,t).join();
    if(vis!==lastTV){const was=lastTV.split(',');lastTV=vis;
      vis.split(',').filter(x=>x&&!was.includes(x)).forEach(x=>{toast(tkMsg(x));navigator.vibrate&&navigator.vibrate([200,100,200])});
      draw();panel(1)}}
  if(radar&&t-radar.t>=60000){radar=null;draw()}
  if(xping&&t-xping.t>=120000){xping=null;draw()}
  if(m.role==='hunter'&&m.state==='alive'){let act=0;Object.entries(g.live||{}).forEach(([hid,o])=>{const un=o&&o[uid];if(un>t){act=1;h+=`<span>📍 ${esc((P()[hid]||{}).name||'?')} ${fmt(un-t)}</span>`}});if(act)draw()}
  if(m.role==='hider'&&m.state==='alive'){
    const lv=Math.max(0,...Object.values((g.live||{})[uid]||{}));
    if(lv>t){h+=`<span class=w>📍 Live geortet ${fmt(lv-t)}</span>`;if(lv>lastLv&&lv-t>1500){toast('Du wirst live geortet!');navigator.vibrate&&navigator.vibrate([300,100,300])}}
    lastLv=Math.max(lastLv,lv);
    const xs=Object.values(g.xp||{}).map(e=>e.t),mx=xs.length?Math.max(...xs):0;
    if(lastXp===null)lastXp=mx;else if(mx>lastXp){lastXp=mx;toast('Extra-Ping! Die Hunter orten gerade alle Hider.');navigator.vibrate&&navigator.vibrate(300)}}
  if(m.role&&t>=g.startAt&&t>=ddLock){const up=ddPlan(g.tasks,P(),md(g)==='mission',t),ks=Object.keys(up);
    if(ks.length){ddLock=t+2500;ks.forEach(i=>db.ref(`games/${code}/tasks/${i}`).update(up[i]).catch(()=>{}))}}
  if(m.role==='hider'&&m.state==='alive')mtTick(g);
  // Hider: eigener letzter Ping
  if(m.role==='hider'&&m.state==='alive'&&t>=R0){const k=Math.floor((t-R0)/(g.s.ping*1000));
    if(k>=1&&k!==lastK){lastK=k;const q=P()[uid];
      if(q&&(q.immUntil||0)>t)toast('Ping ausgesetzt: Du bist geschützt');
      else if(q&&q.lat){ping={k,pts:{[uid]:{lat:q.lat,lng:q.lng,name:q.name}}};navigator.vibrate&&navigator.vibrate(150);toast('Ping gesendet: Hunter sehen deinen Standort');draw()}}}
  // Hunter: Ping-Snapshot
  if(m.role==='hunter'&&m.state==='alive'&&t>=R0){const k=Math.floor((t-R0)/(g.s.ping*1000));
    if(k>=1&&k!==lastK){lastK=k;ping={k,pts:{},grey:{}};const nm=[];
      Object.entries(P()).forEach(([id,p])=>{if(p.role!=='hider'||p.state!=='alive')return;
        if((p.immUntil||0)>t){nm.push(p.name);if(lk[id])ping.grey[id]=lk[id]}
        else if(p.lat){ping.pts[id]={lat:p.lat,lng:p.lng,name:p.name};lk[id]=ping.pts[id]}});
      navigator.vibrate&&navigator.vibrate(300);toast(nm.length?'📡 Ping! Nicht ortbar: '+nm.join(', '):'📡 Ping!');draw()}}
  // Fang-Anfragen
  {const c=(g.catches||{})[uid];if(c&&c.status==='pending'){const hq=P()[c.hunter];if(!hq||hq.state!=='alive')db.ref(`games/${code}/catches/${uid}`).remove().catch(()=>{})}}
  Object.entries(g.catches||{}).forEach(([k,c])=>{if(c.hunter!==uid||m.state!=='alive')return;
    if(c.status==='denied'){toast(CW[c.why]||((P()[k]||{}).name+' hat den Fang abgelehnt'));db.ref(`games/${code}/catches/${k}`).remove()}
    else if(c.status==='pending'&&t-c.t>30000){const p=P()[k],why=catchWhy(p,t);
      if(!why){db.ref(`games/${code}/players/${k}`).update({state:'caught',sT:now()});db.ref(`games/${code}/catches/${k}/status`).set('done')}
      else db.ref(`games/${code}/catches`).child(k).update({status:'denied',why})}});
  // Spielende: jeder Mitspieler prüft, das erste gültige Schreiben gewinnt
  if(m.role&&t>=R0&&t>=endLock){const hs=Object.values(P()).filter(p=>p.role==='hider'),alive=hs.filter(p=>p.state==='alive').length,safe=hs.filter(p=>p.state==='safe').length,hu=Object.values(P()).filter(p=>p.role==='hunter'),huA=hu.filter(p=>p.state==='alive').length;
    const w=!alive?(safe&&missionOk(g)?'hider':'hunter'):(hu.length&&!huA?'hider':(t-R0>=g.s.dur*6e4?(missionOk(g)?'hider':'hunter'):null));
    if(w){endLock=t+4000;db.ref('games/'+code).update({status:'over',winner:w}).catch(()=>{})}}
  $('hud').innerHTML=h;panel()},1000);

(TEST?firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION):Promise.resolve()).then(()=>firebase.auth().signInAnonymously()).then(u=>{uid=u.user.uid;
  if(LS.c){startGPS();join(LS.c)}else panel()}).catch(e=>{$('panel').innerHTML='<h2>Anmeldefehler</h2>'+esc(e.message)});
panel();
</script></body></html>
