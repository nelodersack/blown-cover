        if(p.role==='hider'&&p.out)mkr('out',ll,'p'+k,()=>['Hider '+p.name+' (außerhalb der Zone)','Standort sichtbar']);

      else if(p.state!=='caught'||!(g.catches&&g.catches[k]&&g.catches[k].lat))mkr('stale',ll,'p'+k,()=>[lbl(p)+' ('+(STX[p.state]||'ausgeschieden')+')','letzte bekannte Position'],k);
      return}
    if(p.role===m.role&&p.state==='alive'){if(!(m.role==='hider'&&g.status==='running'))mkr(m.role==='hunter'?'mate':'hider',ll,'p'+k,()=>[lbl(p),'dein Team'],k)}
    else if(m.role==='hunter'&&p.role==='hider'&&p.state==='alive'&&(p.out||p.revealUntil>t))mkr('out',ll,'p'+k,()=>['Hider '+p.name,p.out?'außerhalb der Zone, Standort sichtbar':'Strafzeit, Standort sichtbar'])});
  if(ping){const own=m.role==='hider';
    Object.entries(ping.pts).forEach(([id,p])=>{const q=P()[id];if(!q)return;
      if(own){if(q.state==='alive'){if(id===uid)mkr('pingme',[p.lat,p.lng],'pg'+id,()=>['Dein letzter Ping',ago(ping.t)],id);else mkr('ping',[p.lat,p.lng],'pg'+id,()=>['Hider '+p.name,'Ping '+ago(ping.t)],id)}return}
      if(q.state==='alive')mkr('ping',[p.lat,p.lng],'pg'+id,()=>['Hider '+p.name,'Ping '+ago(ping.t)],id);
      else if(q.state!=='caught')mkr('stale',[p.lat,p.lng],'pg'+id,()=>['Hider '+p.name+' ('+(STX[q.state]||'ausgeschieden')+')','letzter Ping '+ago(ping.t)],id)});
    if(ping.grey)Object.entries(ping.grey).forEach(([id,p])=>{const q=P()[id];if(!q||q.state!=='alive')return;mkr('stale',[p.lat,p.lng],'gr'+id,()=>p.old?['Hider '+p.name+' (nicht aktuell)','letzter Standort '+ago(p.ts||ping.t)]:['Hider '+p.name+' (nicht ortbar)','letzte bekannte Position'],id)})}
  if(m.role==='hunter'&&!spec){
    if(xping){Object.entries(xping.pts).forEach(([id,q])=>{if(P()[id]&&P()[id].state!=='alive')return;mkr('xping',[q.lat,q.lng],'xp'+id,()=>['Hider '+q.name,'Extra-Ping '+ago(xping.t)],id)});
      Object.entries(xping.grey).forEach(([id,q])=>{if(P()[id]&&P()[id].state!=='alive')return;mkr('stale',[q.lat,q.lng],'xg'+id,()=>['Hider '+q.name+' (nicht ortbar)','letzte bekannte Position'],id)})}
    Object.entries(g.live||{}).forEach(([hid,o])=>{const un=o&&o[uid],q=P()[hid];if(!(un>t)||!q||q.state!=='alive')return;
      if(locatable(q,t)){lk[hid]={lat:q.lat,lng:q.lng,name:q.name};mkr(q.out?'out':'live',[q.lat,q.lng],'lv'+hid,()=>['Hider '+q.name,q.out?'Live-Standort, außerhalb der Zone':'Live-Standort'],hid)}
      else if(lk[hid])mkr('stale',[lk[hid].lat,lk[hid].lng],'lg'+hid,()=>['Hider '+q.name+' (nicht ortbar)','letzte bekannte Position'],hid)})}
  if((m.role==='hunter'&&!spec)||spec)Object.entries(g.catches||{}).forEach(([h,c])=>{const q=P()[h];if(c.status==='done'&&c.lat&&q&&q.state==='caught')mkr('catch',[c.lat,c.lng],'ct'+h,()=>['Hider '+q.name+' (gefangen)','Fangort · nach '+fmt(Math.max(0,c.t-rs(g)))+' von '+((P()[c.hunter]||{}).name||'?')])});
  const TKK=id=>id==='sh'?'t-sh':id==='ev'?'t-ev':isDd(id)?'t-dd':'t-mt',TKT=id=>id==='sh'?'Safehouse':id==='ev'?'Evakuierung':isDd(id)?'Dead Drop':'Meeting';
  const task=(id,k)=>{L.circle([k.loc.lat,k.loc.lng],{radius:40,color:'#7c6cff',weight:2,dashArray:'5 5',fillColor:'#7c6cff',fillOpacity:.15}).addTo(lay);
    mkr(TKK(id),[k.loc.lat,k.loc.lng],'tk'+id,()=>[TKT(id),pos?'noch '+Math.round(D(pos,k.loc))+' m':'Ziel'])};
  if(m.role==='hider'&&m.state==='alive'&&g.status==='running')['sh','ev'].forEach(id=>{const k=g.tasks&&g.tasks[id];
    if(!k||t<k.t0||(id==='sh'&&(Object.keys(k.in||{}).length>=2||(k.in&&k.in[uid]))))return;task(id,k)});
  if(m.role==='hider'&&m.state==='alive'&&g.status==='running')Object.entries(g.tasks||{}).filter(([id])=>isDd(id)||isMt(id)).forEach(([id,k])=>{
    if(t<k.t0||k.fin||k.pick||k.ex)return;
    if(k.sol===uid||(isDd(id)&&!k.sol&&((k.a===uid&&!k.dep)||(k.b===uid&&k.dep))))task(id,k)});
  if(spec&&g.status==='running')Object.entries(g.tasks||{}).forEach(([id,k])=>{if(!k||!k.loc||t<k.t0||k.fin||k.ex||k.pick)return;
    if(id==='sh'&&Object.keys(k.in||{}).length>=2)return;task(id,k)});
  if(radar&&t-radar.t<60000)radar.pts.forEach((p,i)=>mkr('hunter',[p.lat,p.lng],'rd'+i,()=>['Hunter '+p.name,'Radar '+ago(radar.t)]));
  if(pos)L.marker([pos.lat,pos.lng],{icon:L.divIcon({className:'mkw me',html:shape('me',uid)+meH(),iconSize:[36,36],iconAnchor:[18,18]}),interactive:false,keyboard:false,zIndexOffset:1000}).addTo(lay);
  drawMarks(m,t);
  redrawing=false;if(reop)reop.openPopup();lgSync()}

function onData(){
  lgData();rpData();rotMode(!!G);
  if(G&&G.status==='lobby'&&G.chk&&G.chk!==lastChk&&!(G.host===uid)){lastChk=G.chk;if(now()-G.chk<15000)fixNow()}
  if(!leaving&&code&&!P()[uid]){leaving=true;toast('Du wurdest aus der Runde entfernt');setTimeout(leave,1200);return}
  if(G.status==='over'&&G.players&&!onData.pc){onData.pc=1;pclean(1);db.ref(`games/${code}/players/${uid}`).update({lat:null,lng:null}).catch(()=>{})}else if(G.status!=='over')onData.pc=0;
  if((G.rn||0)!==lastRn||!rstD){rstD=true;lastRn=G.rn||0;ping=radar=xping=null;lk={};lastK=0;lastTV='';lastHT=null;netW=0;cand=[];hbPick=hbLive=null;wasOut=false;lastLv=0;lastXp=null;oaL=null;oaWarn=false;oaLast=-1;ddLock=0;endLock=0;evSeen=new Set();onData.l=0;lastSig='';MK={};mkSeen=null;if(mkL){mkL.off();mkL=null}hidM=new Set();pclean();try{const sv=JSON.parse(LS['bp_'+code+'_'+lastRn]||'null');if(sv){ping=sv.ping||null;xping=sv.xping||null;lk=sv.lk||{}}}catch(e){}}
  if(G.status==='running'&&!onData.l){onData.l=1;lock()}
  if(G.status==='lobby'&&P()[uid]&&!Number.isInteger(P()[uid].col)&&!P()[uid].w)autoCol();
  panel();draw();chatSync();mkSync()}

// Sekundentakt
setInterval(()=>{if(!G){return}const g=G,t=now(),m=P()[uid]||{};let h='';
  const nw=Date.now();if(nw-lastTick>3000)skipUntil=nw+10000;lastTick=nw;
  if(pos&&nw-lastW>=8000&&nw-lastFix<15000)write(1);
  if(m.role&&t>=hostLock){const ho=P()[g.host];
    if(!ho||ho.lf||(g.status!=='running'&&ho.ts&&t-ho.ts>80000)){
      const c=Object.entries(P()).filter(([k,p])=>!p.lf&&(k===uid||(p.ts&&t-p.ts<30000))).sort(byJ)[0];
      if(c&&c[0]===uid&&g.host!==uid){hostLock=t+5000;db.ref(`games/${code}/host`).set(uid).catch(()=>{})}}}
  if(g.status==='lobby'){$('hud').innerHTML='';return}
  if(g.status==='over'){$('hud').innerHTML='<span>Spiel vorbei</span>';panel();return}
  const R0=rs(g);
  {const ng0=netGap();if(ng0>=5000)netOkSince=0;else if(!netOkSince)netOkSince=nw}
  const selfOk=netOkSince&&nw-netOkSince>15000&&lastAck&&nw-lastAck<15000;
  if(!TEST&&m.role&&conn&&selfOk&&nw>connSince+8000&&nw>skipUntil&&t>=g.startAt+15000){
    Object.entries(P()).forEach(([k,p])=>{if(k===uid||p.state!=='alive'||!p.ts)return;const age=t-p.ts;
      if(age>gwv(g)*1000)evW(k+'_w_'+p.ts,lbl(p)+' hat das Signal verloren',k);
      if(dqOn(g)&&age>gdv(g)*1000&&!evSeen.has(k+'_d')){db.ref(`games/${code}/players/${k}`).update({state:'dq',sT:now()}).catch(()=>{});evW(k+'_d',lbl(p)+' wurde disqualifiziert (Signal verloren)',k)}})}
  if(t<g.startAt)h=`<span>Start in ${fmt(g.startAt-t)}</span>`;
  else if(t<R0)h=m.role==='hunter'?`<span>Hunter starten in ${fmt(R0-t)}</span>`:`<span>Headstart: noch ${fmt(R0-t)}</span>`;
  else{const el=t-R0,nextS=g.s.shrink*6e4-el%(g.s.shrink*6e4),nextP=g.s.ping*1000-el%(g.s.ping*1000);
    h=`<span>${ic('clock')}${fmt(g.s.dur*6e4-el)}</span><span>${ic('zone')}${Math.round(Rad(g,t))} m${Rad(g,t)>g.s.rMin?' · '+fmt(nextS):''}</span><span>${ic('ping')}${fmt(nextP)}</span>`}
  // GPS-Verlust (alle Rollen) & Zone (Hider)
  if(m.role&&m.state==='alive'&&t>=g.startAt){
    const gap=Date.now()-Math.max(lastFix,BOOT),GW=gwv(g),GD=gdv(g); // ab Seitenstart zählen: Neuladen ≠ „seit Ewigkeit kein GPS“
    if(gap>GW*1000)h+=dqOn(g)?`<span class=w>GPS-Signal weg! DQ in ${Math.max(0,GD-Math.floor(gap/1000))} s</span>`:`<span class=w>GPS-Signal weg!</span>`;
    const ng=netGap();
    if(ng>GW*1000){h+=dqOn(g)?`<span class=w>Keine Internetverbindung! DQ in ${Math.max(0,GD-Math.floor(ng/1000))} s</span>`:`<span class=w>Keine Internetverbindung!</span>`;if(!netW){netW=1;lg('netwarn',1);toast('Keine Internetverbindung');navigator.vibrate&&navigator.vibrate([200,100,200])}}
    else if(netW&&ng<5000){netW=0;lg('netwarn',0);toast('Internetverbindung wieder da');rcn()}
    if(dqOn(g)&&gap>GD*1000){db.ref(`games/${code}/players/${uid}`).update({state:'dq',sT:now()});evW(uid+'_d',lbl(m)+' wurde disqualifiziert (Signal verloren)')}
    if(m.role==='hider'&&pos){const out=D(pos,g.c)>Rad(g,t);
      if(out&&!wasOut){wasOut=true;db.ref(`games/${code}/players/${uid}`).update({out:true,revealUntil:0});write(1)}
      if(!out&&wasOut){wasOut=false;db.ref(`games/${code}/players/${uid}`).update({out:false,revealUntil:t+g.s.pen*6e4})}
      if(out)h+=`<span class=w>Außerhalb der Zone! Dein Standort ist sichtbar</span>`;
      else if(m.revealUntil>t)h+=`<span class=w>${ic('ping')}Sichtbar für Hunter: ${fmt(m.revealUntil-t)}</span>`;
      const lim=(g.s.ot||0)*6e4;
      if(lim>0){const nw=Date.now(),dt=oaT?Math.min(3000,nw-oaT):0;oaT=nw;if(oaL===null)oaL=m.oa||0;
        if(out&&gap<=GW*1000)oaL+=dt;
        if(oaL!==oaLast&&t>=oaW){oaW=t+5000;oaLast=oaL;db.ref(`games/${code}/players/${uid}`).update({oa:Math.round(oaL)}).catch(()=>{})}
        const rem=lim-oaL;
        if(out||oaL>0)h+=`<span class="${out?'w':''}">${ic('zone')}Außerhalb erlaubt: ${fmt(Math.max(0,rem))}</span>`;
        if(rem<=60000&&rem>0&&!oaWarn){oaWarn=true;toast('Achtung: weniger als 1 Minute außerhalb der Zone übrig');navigator.vibrate&&navigator.vibrate([200,100,200])}
        if(rem>60000)oaWarn=false;
        if(rem<=0){db.ref(`games/${code}/players/${uid}`).update({oa:Math.round(oaL),state:'dq',sT:now()}).catch(()=>{});evW(uid+'_o',lbl(m)+' wurde disqualifiziert (zu lange außerhalb der Zone)')}}}}
  // Zonenzeit: alle prüfen mit (falls der Hider selbst nicht mehr schreibt)
  if(m.role&&t>=g.startAt&&(g.s.ot||0)>0&&t>=dqLock){const lm=g.s.ot*6e4+5000;
    Object.entries(P()).forEach(([id,p])=>{if(id===uid||p.role!=='hider'||p.state!=='alive'||(p.oa||0)<=lm)return;dqLock=t+4000;
      db.ref(`games/${code}/players/${id}`).update({state:'dq',sT:now()}).catch(()=>{});evW(id+'_o',lbl(p)+' wurde disqualifiziert (zu lange außerhalb der Zone)',id)})}
  if(isSpec(m)&&(ping||radar||xping)){ping=radar=xping=null;draw()}
  if(m.role==='hider'&&m.state==='alive'&&(m.immUntil||0)>t)h+=`<span>Schutz ${fmt(m.immUntil-t)}</span>`;
  if(m.role==='hider'&&m.state==='alive'){const vis=myTk(g,t).join();
    if(vis!==lastTV){const was=lastTV.split(',');lastTV=vis;
      vis.split(',').filter(x=>x&&!was.includes(x)).forEach(x=>{toast(tkMsg(x));navigator.vibrate&&navigator.vibrate([200,100,200])});
      draw();panel(1)}}
  if(m.role==='hunter'&&m.state==='alive'){const T=g.tasks||{},ids=Object.keys(T).filter(i=>(i==='sh'||i==='ev'||isDd(i)||isMt(i))&&T[i]&&t>=T[i].t0&&!T[i].ex).sort().join();
    if(ids!==lastHT){const was=lastHT===null?[]:lastHT.split(','),ms=new Set();lastHT=ids;
      ids.split(',').filter(x=>x&&!was.includes(x)&&t-T[x].t0<20000).forEach(x=>ms.add(x==='sh'?'Safehouse':x==='ev'?'Evakuierung':x[0]==='m'?'Meeting':'Dead Drop'));
      ms.forEach(n=>note(n+' gestartet'))}}
  if(radar&&t-radar.t>=60000){radar=null;draw()}
  if(m.role==='hunter'&&m.state==='alive'){let act=0;Object.entries(g.live||{}).forEach(([hid,o])=>{const un=o&&o[uid];if(un>t){act=1;h+=`<span>${ic('live')}${esc((P()[hid]||{}).name||'?')} ${fmt(un-t)}</span>`}});if(act)draw()}
  if(m.role==='hider'&&m.state==='alive'){
    const lv=Math.max(0,...Object.values((g.live||{})[uid]||{}));
    if(lv>t){h+=`<span class=w>${ic('live')}Live geortet ${fmt(lv-t)}</span>`;if(lv>lastLv&&lv-t>1500){toast('Du wirst live geortet!');navigator.vibrate&&navigator.vibrate([300,100,300])}}
    lastLv=Math.max(lastLv,lv);
    const xs=Object.values(g.xp||{}).map(e=>e.t),mx=xs.length?Math.max(...xs):0;
    if(lastXp===null)lastXp=mx;else if(mx>lastXp){lastXp=mx;toast('Extra-Ping! Die Hunter orten gerade alle Hider.');navigator.vibrate&&navigator.vibrate(300)}}
  if(m.role&&t>=g.startAt&&t>=ddLock){const up=ddPlan(g.tasks,P(),md(g)==='mission',t),ks=Object.keys(up);
    if(ks.length){ddLock=t+2500;ks.forEach(i=>db.ref(`games/${code}/tasks/${i}`).update(up[i]).catch(()=>{}))}}
  if(m.role==='hider'&&m.state==='alive'){mtTick(g);const sk=g.tasks&&g.tasks.sh;
    if(sk&&sk.rv&&!Object.keys(sk.in||{}).length&&t>=rvLock){const el=rvEl();if(el.length&&el.every(u=>sk.rv[u])){rvLock=t+4000;rvApply(sk)}}}
  // Hider: eigener letzter Ping
  if(m.role==='hider'&&m.state==='alive'&&t>=R0){const k=Math.floor((t-R0)/(g.s.ping*1000));
    if(k>=1&&k!==lastK){const fr=t-(R0+k*g.s.ping*1000)<5000;lastK=k;if(fr){const q=P()[uid];
      const pts={};
      if(q&&(q.immUntil||0)>t)toast('Ping ausgesetzt: Du bist geschützt');
      else if(q&&q.lat){pts[uid]={lat:q.lat,lng:q.lng,name:q.name};navigator.vibrate&&navigator.vibrate(150);toast('Ping gesendet: Hunter sehen deinen Standort')}
      // Mitspieler genau so, wie die Hunter sie beim Ping sehen (ohne Geschützte und nicht aktuelle)
      if(hpOn(g))Object.entries(P()).forEach(([id,p])=>{if(id===uid||p.role!=='hider'||p.state!=='alive'||!p.lat||(p.immUntil||0)>t||(!TEST&&t-(p.ts||0)>30000))return;pts[id]={lat:p.lat,lng:p.lng,name:p.name}});
      if(Object.keys(pts).length){ping={k,t:now(),pts};psave();draw()}}}}
  // Hunter: Ping-Snapshot
  if(m.role==='hunter'&&m.state==='alive'&&t>=R0){const k=Math.floor((t-R0)/(g.s.ping*1000));
    if(k>=1&&k!==lastK){const fr=t-(R0+k*g.s.ping*1000)<5000;lastK=k;if(fr){ping={k,t:now(),pts:{},grey:{}};xping=null;const nm=[],old=[],offl=!TEST&&netGap()>gwv(g)*1000;
      Object.entries(P()).forEach(([id,p])=>{if(p.role!=='hider'||p.state!=='alive')return;
        if((p.immUntil||0)>t){nm.push(p.name);if(lk[id])ping.grey[id]=lk[id]}
        else if(p.lat){if(!TEST&&(offl||t-(p.ts||0)>30000)){old.push(p.name);ping.grey[id]={lat:p.lat,lng:p.lng,name:p.name,old:1,ts:p.ts||0}}
          else{ping.pts[id]={lat:p.lat,lng:p.lng,name:p.name};lk[id]=ping.pts[id]}}});
      navigator.vibrate&&navigator.vibrate(300);toast('📡 Ping!'+(nm.length?' Nicht ortbar: '+nm.join(', '):'')+(old.length?(offl?' Du bist offline – Standorte veraltet':' Nicht aktuell: '+old.join(', ')):''));psave();draw()}}}
  // Fang-Anfragen
  {const c=(g.catches||{})[uid];if(c&&c.status==='pending'){const hq=P()[c.hunter];if(!hq||hq.state!=='alive')db.ref(`games/${code}/catches/${uid}`).remove().catch(()=>{})}}
  Object.entries(g.catches||{}).forEach(([k,c])=>{if(c.hunter!==uid||m.state!=='alive')return;
    if(c.status==='denied'){toast(CW[c.why]||((P()[k]||{}).name+' hat den Fang abgelehnt'));db.ref(`games/${code}/catches/${k}`).remove()}
    else if(c.status==='pending'&&t-c.t>30000){const p=P()[k],why=catchWhy(p,t);
      if(!why){db.ref(`games/${code}/players/${k}`).update({state:'caught',sT:now()});db.ref(`games/${code}/catches/${k}/status`).set('done')}
      else db.ref(`games/${code}/catches`).child(k).update({status:'denied',why})}});
  // Spielende: jeder Mitspieler prüft, das erste gültige Schreiben gewinnt
  if(m.role&&t>=R0&&t>=endLock){const hs=Object.values(P()).filter(p=>p.role==='hider'),alive=hs.filter(p=>p.state==='alive').length,safe=hs.filter(p=>p.state==='safe').length,hu=Object.values(P()).filter(p=>p.role==='hunter'),huA=hu.filter(p=>p.state==='alive').length;
    const w=!alive?(safe&&missionOk(g)?'hider':'hunter'):(hu.length&&!huA?'hider':(t-R0>=g.s.dur*6e4?(missionOk(g)?'hider':'hunter'):null));
    if(w){endLock=t+4000;db.ref('games/'+code).update({status:'over',winner:w}).catch(()=>{})}}
  $('hud').innerHTML=h;panel()},1000);

(TEST?firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION):Promise.resolve()).then(()=>firebase.auth().signInAnonymously()).then(u=>{uid=u.user.uid;
  if(LS.c){startGPS();join(LS.c)}else panel()}).catch(e=>{$('panel').innerHTML='<h2>Anmeldefehler</h2>'+esc(e.message)});
panel();
setInterval(()=>{if(G&&G.status==='lobby')panel()},3000);
